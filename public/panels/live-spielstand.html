<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <!-- PWA Meta Tags für "Zum Startbildschirm hinzufügen" -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dart Dashboard" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="manifest" href="/manifest.json" />
  <title>Live-Spielstand TV</title>
  <style>
    html { height: 100%; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a;
      color: #f1f1f1;
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      height: -webkit-fill-available;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      background: #111;
      border-bottom: 3px solid #e63946;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .topbar a { color: #888; text-decoration: none; font-size: .85rem; }
    .topbar a:hover { color: #fff; }
    .topbar h2 { font-size: 1rem; font-weight: 700; flex: 1; text-align: center; }
    .topbar .clock { font-size: .9rem; font-weight: 600; color: #f4a261; font-variant-numeric: tabular-nums; min-width: 80px; text-align: center; }
    .topbar select { background: #1a1a1a; border: 1px solid #444; color: #f1f1f1; padding: 4px 8px; border-radius: 8px; cursor: pointer; font-size: .72rem; font-family: inherit; }
    .topbar select:hover { border-color: #f4a261; }
    .topbar label { font-size: .68rem; color: #888; display: flex; align-items: center; gap: 4px; }
    .topbar .fs-btn { background: #1a1a1a; border: 1px solid #444; color: #f1f1f1; padding: 5px 10px; border-radius: 8px; cursor: pointer; font-size: .78rem; font-family: inherit; transition: all .15s; }
    .topbar .fs-btn:hover { background: #252525; border-color: #f4a261; color: #f4a261; }
    .topbar .fs-btn.active { border-color: #f4a261; color: #f4a261; }
    .topbar .miss-btn {
      background: #8b0000;
      border: 1px solid #e63946;
      color: #f1f1f1;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: .78rem;
      font-family: inherit;
      transition: all .15s;
      white-space: nowrap;
    }
    .topbar .miss-btn:hover { background: #a00; border-color: #f4a261; color: #f4a261; }
    .topbar .miss-btn:disabled { opacity: .4; cursor: default; }
    .daily-hs {
      font-size: .72rem;
      color: #f4a261;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 3px 10px;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .daily-hs .hs-label { color: #777; font-size: .6rem; text-transform: uppercase; letter-spacing: 1px; }
    .daily-hs .hs-val { font-weight: 800; font-variant-numeric: tabular-nums; }
    .topbar .restart-btn {
      background: #1a1a1a;
      border: 1px solid #f4a261;
      color: #f4a261;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: .78rem;
      font-family: inherit;
      transition: all .15s;
      white-space: nowrap;
    }
    .topbar .restart-btn:hover { background: #252525; border-color: #e63946; color: #e63946; }
    .topbar .undo-btn {
      background: #1a1a1a;
      border: 1px solid #888;
      color: #f1f1f1;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: .78rem;
      font-family: inherit;
      transition: all .15s;
      white-space: nowrap;
    }
    .topbar .undo-btn:hover { border-color: #f4a261; color: #f4a261; }
    .topbar .undo-btn:disabled { opacity: .4; cursor: default; }

    main {
      padding: 6px;
      max-width: none;
      margin: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    .focus-player {
      flex: 1;
      display: grid;
      grid-template-columns: 1.35fr .65fr;
      gap: 4px;
      align-items: stretch;
      min-height: 0;
      overflow: hidden;
    }
    .focus-player.single { grid-template-columns: 1fr; }
    .focus-player.has-others { flex: 1; max-height: 70%; min-height: 0; }

    .compact-players {
      display: flex;
      gap: 4px;
      flex: 0 0 clamp(112px, 16vh, 140px);
      height: clamp(112px, 16vh, 140px);
      max-height: none;
      min-height: 0;
    }
    .compact-players:empty { display: none; }
    .compact-players .score-card {
      flex: 1;
      min-width: 0;
      justify-content: flex-start;
      gap: 2px;
      padding: 4px 10px 4px;
      align-items: center;
      text-align: center;
    }
    .compact-players .score-card .sc-color-bar { margin-bottom: 1px; }
    .compact-players .score-card .sc-name { font-size: .78rem; }
    .compact-players .score-card .sc-score { font-size: 2rem; }
    .compact-players .score-card .sc-last-throws { margin-top: 0; }
    .compact-players .score-card .sc-last-throws,
    .compact-players .score-card .cricket-grid,
    .compact-players .score-card .compact-cricket-status { justify-content: center; margin-top: 0; margin-bottom: 0; }
    .compact-cricket-status {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 2px;
      width: 100%;
      margin: 1px 0;
    }
    .compact-cricket-status span {
      color: #aaa;
      background: #1b1b1b;
      border-radius: 4px;
      padding: 2px 0;
      font-size: .5rem;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
    }
    .compact-cricket-status span.closed { color: #2a9d8f; font-weight: 700; }

    /* Countdown – immer mit fester Höhe, aber ausblendbar */
    #countdownDisplay {
      flex-shrink: 0;
      height: 0;
      text-align: center;
      padding: 0;
      background: transparent;
      border: 0;
      border-radius: 10px;
      color: #f4a261;
      font-weight: 700;
      font-size: .9rem;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      line-height: 20px;
      overflow: hidden;
    }
    #countdownDisplay.visible {
      height: 30px;
      padding: 4px 0;
      background: #1a1a1a;
      border: 1px solid #e63946;
      opacity: 1;
      pointer-events: auto;
    }

    .focus-card {
      background: linear-gradient(135deg, #191111, #141414);
      border-radius: 14px;
      padding: 10px;
      border: 2px solid var(--pc, #e63946);
      box-shadow: 0 0 30px rgba(230,57,70,.16);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }
    .focus-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 20% 10%, var(--pc-glow, rgba(230,57,70,.18)), transparent 35%);
      pointer-events: none;
    }
    .focus-card > * { position: relative; }
    .focus-name { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 2rem; font-weight: 800; margin-bottom: 2px; flex-shrink: 0; }
    .focus-switch-timer { display: none; flex: 0 0 auto; color: #f4a261; background: rgba(244,162,97,.1); border: 1px solid rgba(244,162,97,.45); border-radius: 8px; padding: 6px 12px; font-size: .72rem; font-weight: 700; letter-spacing: .4px; white-space: nowrap; }
    .focus-switch-timer.visible { display: inline-flex; align-items: center; }
    .focus-meta { color: #777; font-size: .68rem; margin-bottom: 4px; flex-shrink: 0; }
    .focus-kacheln {
      display: grid;
      grid-template-columns: 0.6fr 1.4fr;
      gap: 4px;
      flex: 1;
      min-height: 0;
    }
    .focus-kachel:nth-child(1) {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 0;
    }
    .focus-kachel:nth-child(2) {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 6px 8px;
      min-height: 0;
    }
    .focus-kachel:nth-child(2) > div {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      padding: 5px 6px;
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      min-height: clamp(9rem, 22vh, 12rem);
      position: relative;
    }
    .focus-kachel:nth-child(2) h4 {
      position: absolute;
      top: 5px;
      left: 5px;
      right: 5px;
      margin: 0;
      font-size: .6rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-align: center;
    }
    .focus-kachel {
      background: #0f0f0f;
      border: 1px solid #262626;
      border-radius: 11px;
      padding: 8px;
      min-height: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      position: relative;
    }
    .focus-kachel > h4 { position: absolute; top: 10px; left: 8px; right: 8px; color: #777; font-size: .6rem; letter-spacing: 1.5px; text-transform: uppercase; margin: 0; flex-shrink: 0; }
    .focus-kachel .subline { color: #555; font-size: .62rem; margin-top: 2px; flex-shrink: 0; }
    .throw-segments {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      max-width: 168px;
      flex: 1;
      justify-content: center;
    }
    .throw-seg {
      background: #1b1b1b;
      border: 1px solid #2b2b2b;
      border-radius: 10px;
      min-height: 155px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-weight: 800;
      padding: 2px 0;
    }
    .throw-seg .pts { font-size: 2.7rem; color: var(--pc, #e63946); }
    .throw-seg .seg { font-size: .95rem; color: #555; margin-top: 1px; }
    .throw-seg.bust { border-color: #e63946; background: #2a0a0a; box-shadow: 0 0 15px rgba(230,57,70,.4); }
    .throw-seg.bust .pts { color: #e63946; font-size: 2.52rem; }
    .throw-seg.bust .seg { color: #e63946; font-size: .8rem; }

    /* Bust-Overlay */
    .bust-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(230,57,70,.15);
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
      animation: bust-flash 0.6s ease-out;
    }
    .bust-overlay .bust-text {
      background: #e63946; color: #fff;
      font-size: 3rem; font-weight: 900;
      padding: 20px 50px; border-radius: 20px;
      text-transform: uppercase; letter-spacing: 4px;
      box-shadow: 0 0 60px rgba(230,57,70,.6);
      animation: bust-pulse 0.8s ease-in-out infinite alternate;
    }
    @keyframes bust-flash { 0% { opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes bust-pulse { from { transform: scale(1); } to { transform: scale(1.08); } }

    /* Elimination-Overlay */
    .elimination-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(139,0,0,.25);
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
      animation: elimination-flash 0.8s ease-out;
    }
    .elimination-overlay .elimination-text {
      background: linear-gradient(135deg, #8b0000, #ff0000); color: #fff;
      font-size: 3.5rem; font-weight: 900;
      padding: 30px 60px; border-radius: 25px;
      text-transform: uppercase; letter-spacing: 6px;
      box-shadow: 0 0 80px rgba(255,0,0,.8), 0 0 160px rgba(139,0,0,.6);
      animation: elimination-pulse 0.6s ease-in-out infinite alternate;
      text-shadow: 0 0 20px rgba(255,255,255,.5);
    }
    @keyframes elimination-flash { 0% { opacity: 0; transform: scale(0.8); } 15% { opacity: 1; transform: scale(1.05); } 85% { opacity: 1; } 100% { opacity: 0; transform: scale(1.1); } }
    @keyframes elimination-pulse { from { transform: scale(1); box-shadow: 0 0 80px rgba(255,0,0,.8), 0 0 160px rgba(139,0,0,.6); } to { transform: scale(1.1); box-shadow: 0 0 120px rgba(255,0,0,1), 0 0 240px rgba(139,0,0,.8); } }

    .cricket-score-animation {
      position: fixed;
      top: 42%;
      left: 50%;
      z-index: 9998;
      color: #f4a261;
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 900;
      text-shadow: 0 0 20px rgba(244,162,97,.8);
      pointer-events: none;
      animation: cricket-score-pop 1.1s ease-out forwards;
    }
    @keyframes cricket-score-pop {
      0% { opacity: 0; transform: translate(-50%, 20px) scale(.7); }
      20% { opacity: 1; transform: translate(-50%, 0) scale(1.15); }
      100% { opacity: 0; transform: translate(-50%, -70px) scale(1); }
    }

    .focus-big-score {
      font-size: clamp(11.4rem, 13.2vw, 14.4rem);
      font-weight: 900;
      line-height: 1;
      color: var(--pc, #f4a261);
      font-variant-numeric: tabular-nums;
      overflow: visible;
      white-space: nowrap;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .focus-summary {
      margin-top: 4px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      flex-shrink: 0;
    }
    .focus-summary div { background: #141414; border-radius: 10px; padding: 4px; text-align: center; }
    .focus-summary span { display: block; color: #666; font-size: .5rem; text-transform: uppercase; letter-spacing: 1px; }
    .focus-summary strong { display: block; color: #f1f1f1; font-size: .78rem; margin-top: 1px; }

    /* Leg-Liste – feste Höhe (25% reduziert) */
    .focus-leg-card {
      background: #141414;
      border-radius: 14px;
      padding: 5px;
      border: 2px solid #1e1e1e;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
      flex-shrink: 0;
      /* Höhe: h4 (~18px) + gap (4px) + leg-list max-height (285px) + padding (10px) = ~317px */
      height: 317px;
    }
    .focus-leg-card h4 {
      color: #777;
      font-size: .56rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-align: center;
      flex-shrink: 0;
    }
    .focus-right-col {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 0;
      overflow: hidden;
    }
    .focus-controls-card {
      background: #141414;
      border-radius: 14px;
      padding: 6px 10px;
      border: 2px solid #1e1e1e;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex-shrink: 0;
      height: 236px !important;
    }
    .focus-controls-card .ctrl-title {
      color: #777;
      font-size: .52rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-align: center;
    }
    .focus-controls-card .ctrl-row {
      display: flex;
      gap: 4px;
      align-items: stretch;
      flex: 1;
    }
    .focus-controls-card .ctrl-row.action-row {
      flex: 0 0 88px;
    }
    .focus-controls-card .ctrl-btn {
      flex: 1;
      padding: 24px 8px;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #2a2a2a;
      background: #1a1a1a;
      color: #f1f1f1;
      font-size: .82rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all .15s;
      text-align: center;
      min-height: 52px !important;
      height: 100% !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }
    .focus-controls-card .ctrl-btn:hover { border-color: #f4a261; color: #f4a261; }
    .focus-controls-card .ctrl-btn.miss { border-color: #e63946; background: #8b0000; }
    .focus-controls-card .ctrl-btn.miss:hover { background: #a00; border-color: #f4a261; color: #f4a261; }
    .focus-controls-card .ctrl-btn.restart { border-color: #f4a261; color: #f4a261; }
    .focus-controls-card .ctrl-btn.restart:hover { border-color: #e63946; color: #e63946; }
    .focus-controls-card .ctrl-btn:disabled { opacity: .4; cursor: default; }
    
    /* Mode/Rule Buttons - gleiche Höhe, nur Label/Value Styling */
    .focus-controls-card .ctrl-btn.mode-btn,
    .focus-controls-card .ctrl-btn.rule-btn {
      padding: 24px 8px;
      justify-content: center;
      height: 80% !important;
      align-self: center;
    }
    .focus-controls-card .ctrl-btn .btn-label {
      font-size: .5rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 2px;
    }
    .focus-controls-card .ctrl-btn .btn-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f4a261;
      margin: 0;
    }
    
    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.show {
      display: flex;
      opacity: 1;
    }
    .modal-content {
      background: #1a1a1a;
      border: 2px solid #e63946;
      border-radius: 16px;
      padding: 20px;
      min-width: 280px;
      max-width: 90vw;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 0 40px rgba(230,57,70,.4);
      transform: scale(0.9);
      transition: transform 0.2s ease;
    }
    .modal-overlay.show .modal-content {
      transform: scale(1);
    }
    .modal-content h4 {
      color: #f4a261;
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-align: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #333;
    }
    .modal-options {
      display: grid;
      gap: 8px;
      max-height: 400px;
      overflow-y: auto;
    }
    .modal-option {
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 16px 20px;
      color: #f1f1f1;
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
      text-align: center;
      touch-action: manipulation;
    }
    .modal-option:hover,
    .modal-option:active {
      background: #222;
      border-color: #f4a261;
      color: #f4a261;
    }
    .modal-option.selected {
      background: #2a0a0a;
      border-color: #e63946;
      color: #e63946;
    }
    .modal-close {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 8px;
      color: #888;
      font-size: .75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
    }
    .modal-close:hover {
      border-color: #f4a261;
      color: #f4a261;
    }
    .leg-list {
      width: 100%;
      display: grid;
      gap: 3px;
      overflow: auto;
      /* 25% reduziert: 380px → 285px */
      max-height: 285px;
    }
    .leg-item { 
      display: grid;
      grid-template-columns: 80px 1fr 80px;
      align-items: center;
      background: #1b1b1b;
      border: 1px solid #2b2b2b;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: .65rem;
      gap: 8px;
    }
    .leg-item > * {
      display: flex;
      align-items: center;
    }
    .leg-item .idx {
      color: #777;
      font-weight: 600;
      justify-content: flex-end;
      padding-right: 8px;
      border-right: 1px solid #333;
    }
    .leg-item .throws {
      justify-content: center;
      gap: 6px;
      color: #ddd;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .leg-item .throws .sep {
      color: #555;
      font-weight: 300;
    }
    .leg-item .score {
      color: #f4a261;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      justify-content: flex-end;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    .score-card {
      background: #141414;
      border-radius: 12px;
      padding: 14px;
      border: 2px solid #1e1e1e;
      position: relative;
      overflow: hidden;
      display: flex;
      flex: 1;
      min-width: 0;
      flex-direction: column;
      gap: 8px;
    }
    .score-card .sc-color-bar { width: 100%; height: 3px; background: var(--pc, #e63946); border-radius: 3px; margin-bottom: 10px; flex-shrink: 0; }
    .score-card .sc-name { font-size: .9rem; font-weight: 700; }
    .score-card .sc-score { font-size: 2.4rem; font-weight: 800; line-height: 1; color: var(--pc, #f4a261); font-variant-numeric: tabular-nums; }
    .score-card .sc-stats { font-size: .72rem; color: #666; line-height: 1.6; }
    .score-card .sc-stats span { color: #aaa; font-weight: 600; }
    .score-card .sc-last-throws { display: flex; gap: 4px; margin-top: 4px; }
    .score-card .sc-throw-chip { background: #1e1e1e; border-radius: 5px; padding: 3px 8px; font-size: .78rem; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 28px; text-align: center; }
    .score-card .sc-throw-chip.empty { color: #333; }

    /* === NEU: Cricket‑Grid für kompakte Kacheln === */
    .cricket-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 12px;
      margin: 8px 0;
    }
    .cricket-num {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-width: 50px;
    }
    .cricket-num .num-label {
      font-weight: 700;
      font-size: .7rem;
      color: #f1f1f1;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .cricket-hits {
      display: flex;
      gap: 3px;
    }
    .hit-marker {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      border: 2px solid #333;
      background: #1a1a1a;
      transition: all 0.3s ease;
      position: relative;
    }
    .hit-marker.hit-1,
    .hit-marker.hit-2,
    .hit-marker.hit-3 {
      background: #2a9d8f;
      border-color: #2a9d8f;
    }
    .hit-marker.closed {
      background: #1a1a1a;
      border-color: #2a9d8f;
    }
    .hit-marker.closed::after {
      content: '✕';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #2a9d8f;
      font-size: 14px;
      font-weight: 900;
      line-height: 1;
      pointer-events: none;
    }
    .cricket-num .points {
      font-size: .55rem;
      color: #f4a261;
      font-weight: 700;
      white-space: nowrap;
    }

    /* Winner Overlay */
    .winner-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .winner-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .winner-card {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border: 3px solid #f4a261;
      border-radius: 24px;
      padding: 40px 60px;
      text-align: center;
      box-shadow: 0 0 60px rgba(244, 162, 97, 0.4), 0 20px 40px rgba(0,0,0,0.5);
      transform: scale(0.9);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .winner-overlay.show .winner-card {
      transform: scale(1);
    }
    .winner-icon {
      font-size: 4rem;
      margin-bottom: 16px;
      animation: bounce 1s ease infinite;
    }
    .winner-subtitle {
      font-size: 1.2rem;
      color: #aaa;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .winner-name {
      font-size: 3rem;
      font-weight: 900;
      color: #f4a261;
      margin-bottom: 16px;
      text-shadow: 0 0 30px rgba(244, 162, 97, 0.6);
    }
    .winner-stats {
      display: flex;
      gap: 32px;
      justify-content: center;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid rgba(244, 162, 97, 0.3);
    }
    .winner-stat {
      text-align: center;
    }
    .winner-stat-label {
      font-size: 0.8rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .winner-stat-value {
      font-size: 1.8rem;
      font-weight: 800;
      color: #f4a261;
    }
    .winner-btn {
      background: linear-gradient(135deg, #f4a261, #e63946);
      border: none;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 16px 48px;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .winner-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 30px rgba(244, 162, 97, 0.5);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1a1a1a;
      color: #f1f1f1;
      padding: 12px 28px;
      border-radius: 12px;
      border: 1px solid #333;
      font-size: .9rem;
      opacity: 0;
      transition: opacity .3s ease, transform .3s ease;
      z-index: 9999;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }
    .toast.err {
      border-color: #e63946;
      color: #e63946;
    }

    .confetti-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 10001;
    }
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      top: -10px;
      animation: confetti-fall 3s linear forwards;
    }
    @keyframes confetti-fall {
      to {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
      }
    }

    /* Spezielle TV-Auflösung (1024x860) – kompakte Kacheln in einer Zeile */
    @media (width: 1024px) and (height: 860px) {
      .focus-kacheln { grid-template-columns: 0.5fr 1.5fr; }
      .focus-kachel { min-height: 0; padding: 6px; }
      .focus-kachel:nth-child(2) > div { min-height: 6rem; }
      .focus-kachel h4 { font-size: .5rem; }
      .throw-seg { min-height: 70px; }
      .throw-seg .pts { font-size: 1.98rem; }
      .throw-seg .seg { font-size: .8rem; }
      .focus-big-score { font-size: clamp(6rem, 13.2vw, 9.36rem); }
      .focus-summary { margin-top: 2px; }
      .focus-summary div { padding: 3px; }
      .focus-summary span { font-size: .4rem; }
      .focus-summary strong { font-size: .65rem; }
      .focus-player.has-others { flex: 1; }
      .focus-leg-card { display: none; }
      .compact-players { gap: 3px; flex-basis: 128px; height: 128px; max-height: none; }
      .compact-players .score-card { padding: 4px 8px; gap: 3px; flex-direction: row; align-items: center; border-radius: 6px; }
      .compact-players .score-card .sc-color-bar { width: 3px; height: 28px; align-self: center; flex-shrink: 0; border-radius: 2px; }
      .compact-players .score-card .sc-name { font-size: .6rem; white-space: nowrap; flex-shrink: 0; }
      .compact-players .score-card .sc-score { font-size: 1rem; white-space: nowrap; flex-shrink: 0; }
      .compact-players .score-card .sc-stats { font-size: .45rem; white-space: nowrap; flex-shrink: 0; }
      .compact-players .score-card .sc-last-throws { flex-shrink: 0; }
      .compact-players .score-card .sc-throw-chip { font-size: .5rem; padding: 1px 3px; min-width: 14px; border-radius: 4px; }
      .compact-players .score-card.compact-crowded { flex-direction: column; align-items: center; }
        .compact-players .score-card.compact-crowded {
          justify-content: flex-start;
          gap: 2px;
          padding: 4px 8px 3px;
        }
        .compact-players .score-card.compact-crowded .sc-color-bar { width: 100%; height: 3px; margin-bottom: 2px; }
        .compact-players .score-card.compact-crowded .sc-score { line-height: .9; }
      .compact-players .score-card.compact-crowded .compact-cricket-status { font-size: .42rem; }
      /* Cricket-Grid für die kompakte Zeile */
      .compact-players .score-card .cricket-grid {
        gap: 4px 6px;
        margin: 4px 0;
      }
      .compact-players .score-card .cricket-num {
        min-width: 40px;
        gap: 2px;
      }
      .compact-players .score-card .num-label {
        font-size: .55rem;
      }
      .compact-players .score-card .hit-marker {
        width: 14px;
        height: 14px;
      }
      .compact-players .score-card .hit-marker.hit-1,
      .compact-players .score-card .hit-marker.hit-2,
      .compact-players .score-card .hit-marker.hit-3 {
        background: #2a9d8f;
        border-color: #2a9d8f;
      }
      .compact-players .score-card .hit-marker.closed {
        background: #1a1a1a;
        border-color: #2a9d8f;
      }
      .compact-players .score-card .hit-marker.closed::after {
        font-size: 10px;
        color: #2a9d8f;
      }
      .focus-controls-card .ctrl-title { font-size: .42rem; }
      .focus-controls-card .ctrl-btn { font-size: .65rem; padding: 16px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
      .focus-controls-card { display: none; height: 236px !important; }
    }

    /* Tablet-Auflösungen – Buttons hoch genug */
    @media (min-width: 768px) and (max-width: 1600px) and (min-height: 600px) {
      .focus-controls-card { height: 236px !important; }
      .focus-controls-card .ctrl-btn { padding: 24px 8px !important; min-height: 52px !important; height: 100% !important; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: .82rem; }
    }

    /* Fallback für alle Touch-Geräte */
    @media (pointer: coarse) {
      .focus-player.has-others { max-height: none; }
      .focus-player.single { grid-template-rows: minmax(0, 1fr) auto; }
      .focus-card { min-height: 0; padding: 6px; }
      .focus-name { font-size: 1.5rem; }
      .focus-big-score { font-size: clamp(6rem, 9.6vw, 9.6rem); }
      .focus-controls-card { height: 236px !important; }
      .focus-controls-card .ctrl-btn { min-height: 52px !important; padding: 24px 8px !important; height: 100% !important; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: .82rem; }
    }

    @media (min-width: 768px) and (max-width: 1600px) and (min-height: 600px) and (max-height: 1024px) {
      .focus-player.has-others { max-height: none; }
      .focus-player.single { grid-template-rows: minmax(0, 1fr) auto; }
      .focus-card { min-height: 0; padding: 6px; }
      .focus-name { font-size: 1.5rem; }
      .focus-big-score { font-size: clamp(6rem, 9.6vw, 9.6rem); }
    }
  </style>
</head>
<body>
  <!-- Winner Overlay -->
  <div class="winner-overlay" id="winnerOverlay"></div>
  
  <!-- Toast -->
  <div class="toast" id="toast"></div>
  
  <div class="topbar">
    <a href="/" title="Zurück zur Übersicht">← Zurück</a>
    <h2>🎯 Live-Spielstand</h2>
    <div class="clock" id="clockDisplay">--:--:--</div>
    <button class="fs-btn" id="fsBtn" onclick="toggleFullscreen()" title="Vollbild aktivieren">⛶</button>
    <button class="restart-btn" id="restartLegBtn" onclick="restartLeg()" title="Leg zurücksetzen">↻ Leg-Neustart</button>
    <div class="daily-hs" id="dailyHsDisplay" title="Heutiger Höchstwert"><span class="hs-label">Heute</span><span class="hs-val">–</span></div>
  </div>

  <main>
    <section class="focus-player" id="focusPlayer"><div style="text-align:center;padding:40px;color:#555">Lade Spieler...</div></section>
    <section class="compact-players" id="compactPlayers"></section>
    <!-- Countdown – immer im DOM, feste Höhe, Sichtbarkeit über Klasse -->
    <div id="countdownDisplay">Nächster Spieler in 5s</div>
  </main>

  <script>
    let liveState = null;
    let countdownTimer = null;
    let pendingWinner = null;
    let isFirstLoad = true;
    let lastCricketAnimationKey = '';

    function startCountdown(state) {
      if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
      const action = state && state.lastAction;
      const el = document.querySelector('.focus-switch-timer') || document.getElementById('countdownDisplay');
      if (!action || !action.autoAdvancePending || !action.autoAdvanceDelayMs) {
        if (el) { el.classList.remove('visible'); el.textContent = ''; }
        return;
      }
      const startedAt = action.autoAdvanceStartedAt || Date.now();
      const delayMs = action.autoAdvanceDelayMs;
      countdownTimer = setInterval(() => {
        const elapsed = Date.now() - startedAt;
        const remaining = Math.max(0, delayMs - elapsed);
        if (remaining <= 0) {
          if (el) { el.classList.remove('visible'); el.textContent = ''; }
          if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
          return;
        }
        if (el) {
          el.classList.add('visible');
          el.textContent = 'Nächster Spieler in ' + Math.ceil(remaining / 1000) + 's';
        }
      }, 200);
    }

    function escapeHtml(str) { if (!str) return ''; return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function escapeAttr(str) { if (!str) return ''; return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function getPointsPerAufnahme(player) {
      const currentRound = Array.isArray(player && player.currentRoundPoints) ? player.currentRoundPoints : [];
      if (currentRound.length > 0) {
        return currentRound.reduce((sum, pt) => sum + (Number(pt) || 0), 0);
      }
      return 0;
    }

    function getLiveLegStats(player) {
      const throws = Array.isArray(player && player.throws) ? player.throws : [];
      const darts = Number(player && player.turns) || throws.length;
      const totalScored = Number(player && player.totalScored) || 0;
      const legAverage = darts > 0 ? (totalScored / darts * 3).toFixed(1) : '-';
      const firstNine = throws.slice(0, 9);
      const firstNineScore = firstNine.reduce((sum, item) => sum + (item && item.bust ? 0 : (Number(item && item.points) || 0)), 0);
      const firstNineAverage = firstNine.length >= 9 ? (firstNineScore / 9 * 3).toFixed(1) : '-';
      const checkoutAttempts = Number(player && player.checkoutAttempts) || 0;
      const checkoutSuccess = Number(player && player.checkoutSuccess) || 0;
      const checkout = checkoutAttempts > 0 ? ((checkoutSuccess / checkoutAttempts) * 100).toFixed(1) + '%' : '-';
      return { legAverage, firstNineAverage, checkout };
    }

    function renderFocusPlayer(p, idx, state) {
      if (!p) return '';
      const currentRound = Array.isArray(p.currentRoundPoints) ? p.currentRoundPoints : [];
      const throws = Array.isArray(p.throws) ? p.throws : [];
      const currentRoundThrows = throws.slice(-currentRound.length);
      const displayThrows = [...currentRound];
      while (displayThrows.length < 3) displayThrows.push(null);
      const totalScored = p.totalScored || 0;
      const legStats = getLiveLegStats(p);
      const aufnahmeScore = getPointsPerAufnahme(p);
      const isElimination = state.game.mode === 'elimination';
      
      const throwsHtml = displayThrows.map((pt, ti) => {
        const throwData = currentRoundThrows[ti];
        const isBust = !!(throwData && throwData.bust);
        const pointsLabel = isBust ? 'BUST' : (pt === null ? 'offen' : (pt === 0 ? '0' : '+' + pt));
        // Segment aus dem passenden Wurf-Eintrag holen
        let segmentLabel = '-';
        if (pt !== null) {
          if (throwData && throwData.segment) {
            segmentLabel = throwData.segment;
          } else {
            segmentLabel = String(pt);
          }
        }
        return '<div class="throw-seg' + (isBust ? ' bust' : '') + '" style="--pc:' + escapeAttr(p.color || '#f4a261') + '">' +
          '<div class="pts">' + pointsLabel + '</div>' +
          '<div class="seg">' + segmentLabel + '</div>' +
        '</div>';
      }).join('');

      // Elimination: Punkte statt Rest anzeigen
      const bigScoreLabel = isElimination ? 'Punkte' : 'Rest';
      const bigScoreValue = isElimination ? totalScored : p.remaining;

      return '<div class="focus-card" style="--pc:' + escapeAttr(p.color || '#f4a261') + ';--pc-glow:' + colorToRgba(p.color || '#e63946', .18) + '">' +
        '<div class="focus-name"><span>🎯 ' + escapeHtml(p.name) + (isElimination ? ' · Elimination' : '') + '</span><span class="focus-switch-timer"></span></div>' +
        '<div class="focus-kacheln">' +
          '<div class="focus-kachel">' +
            '<h4>Aktuelle Würfe / Zahlen</h4>' +
            '<div class="throw-segments">' + throwsHtml + '</div>' +
          '</div>' +
          '<div class="focus-kachel">' +
            '<div>' +
              '<h4>' + bigScoreLabel + '</h4>' +
              '<div class="focus-big-score">' + bigScoreValue + '</div>' +
            '</div>' +
            '<div>' +
              '<h4>pro Aufnahme</h4>' +
              '<div class="focus-big-score">' + aufnahmeScore + '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="focus-summary">' +
          '<div><span>Schnitt</span><strong>' + legStats.legAverage + '</strong></div>' +
          '<div><span>Erster-9-AVG</span><strong>' + legStats.firstNineAverage + '</strong></div>' +
          '<div><span>Checkout</span><strong>' + legStats.checkout + '</strong></div>' +
        '</div>' +
      '</div>';
    }

    function renderFocusLegCard(p) {
      if (!p) return '';
      const throws = Array.isArray(p.throws) ? p.throws : [];
      const turnScores = [];
      const hasTurnRounds = throws.some(t => Number.isFinite(Number(t && t.turnRound)));
      if (hasTurnRounds) {
        throws.forEach((throwData) => {
          const turnRound = Number(throwData && throwData.turnRound);
          const previous = turnScores[turnScores.length - 1];
          if (!previous || previous.turnRound !== turnRound) turnScores.push({ turnRound, score: 0, busted: false, throws: [] });
          const turn = turnScores[turnScores.length - 1];
          turn.score += throwData.bust ? 0 : (Number(throwData.points) || 0);
          turn.busted = turn.busted || !!throwData.bust;
          turn.throws.push({ label: throwData.segment || throwData.points, bust: !!throwData.bust });
        });
      } else {
        for (let i = 0; i < throws.length; i += 3) {
          const chunk = throws.slice(i, i + 3);
          turnScores.push({ score: chunk.some(t => t.bust) ? 0 : chunk.reduce((sum, t) => sum + (Number(t.points) || 0), 0), busted: chunk.some(t => t.bust), throws: chunk.map(t => ({ label: t.segment || t.points, bust: !!t.bust })) });
        }
      }
      const legListHtml = turnScores.length
        ? turnScores.slice(-20).reverse().map((turn, orderIdx) => {
            const turnIdx = turnScores.length - orderIdx;
            const throwsHtml = turn.throws.map((throwData, si) =>
              '<span' + (throwData.bust ? ' class="bust"' : '') + '>' + escapeHtml(throwData.label) + (throwData.bust ? ' BUST' : '') + '</span>' + (si < turn.throws.length - 1 ? '<span class="sep">|</span>' : '')
            ).join('');
            return '<div class="leg-item">' +
              '<span class="idx">Aufnahme ' + turnIdx + '</span>' +
              '<span class="throws">' + throwsHtml + '</span>' +
              '<span class="score">' + turn.score + '</span>' +
            '</div>';
          }).join('')
        : '<div class="subline">Noch keine Aufnahmen erfasst</div>';
      return '<aside class="focus-leg-card" style="--pc:' + escapeAttr(p.color || '#f4a261') + '">' +
        '<h4>Aufnahmen im Leg</h4>' +
        '<div class="leg-list">' + legListHtml + '</div>' +
      '</aside>';
    }

    function renderControlsCard(state) {
      if (!state) return '';
      const mode = state.game.mode || '501';
      const rule = state.game.checkoutRule || 'double';
      const modeLabel = mode === '501' ? '501' : mode === '301' ? '301' : mode === '701' ? '701' : mode === 'cricket' ? 'Cricket' : mode === 'elimination' ? 'Elimination' : mode === 'shanghai' ? 'Shanghai' : mode === 'atc' ? 'ATC' : mode === 'split' ? 'Split' : mode;
      const ruleLabel = rule === 'single' ? 'Single Out' : rule === 'double' ? 'Double Out' : rule === 'master' ? 'Master Out' : rule;
      return '<div class="focus-controls-card">' +
        '<div class="ctrl-title">⚙ Steuerung</div>' +
        '<div class="ctrl-row">' +
          '<button class="ctrl-btn mode-btn" id="ctrlModeBtn" onclick="openModeModal()" title="Spielmodus ändern">' +
            '<span class="btn-label">Modus</span><span class="btn-value">' + modeLabel + '</span>' +
          '</button>' +
          '<button class="ctrl-btn rule-btn" id="ctrlRuleBtn" onclick="openRuleModal()" title="Finish-Regel ändern">' +
            '<span class="btn-label">Finish</span><span class="btn-value">' + ruleLabel + '</span>' +
          '</button>' +
        '</div>' +
        '<div class="ctrl-row action-row">' +
          '<button class="ctrl-btn miss" id="focusMissBtn" onclick="skipPlayer()" title="Fehlwurf">✖ Fehlwurf</button>' +
          '<button class="ctrl-btn undo" id="focusUndoBtn" onclick="undoLastThrow()" title="Letzten Wurf zurücksetzen">↶ Letzten Wurf</button>' +
        '</div>' +
        '<div class="modal-overlay" id="modeModal" onclick="closeModal(this, event)">' +
          '<div class="modal-content" onclick="event.stopPropagation()">' +
            '<h4>Spielmodus wählen</h4>' +
            '<div class="modal-options" id="modeOptions"></div>' +
            '<button class="modal-close" onclick="closeModal(document.getElementById(\'modeModal\'))">Abbrechen</button>' +
          '</div>' +
        '</div>' +
        '<div class="modal-overlay" id="ruleModal" onclick="closeModal(this, event)">' +
          '<div class="modal-content" onclick="event.stopPropagation()">' +
            '<h4>Finish-Regel wählen</h4>' +
            '<div class="modal-options" id="ruleOptions"></div>' +
            '<button class="modal-close" onclick="closeModal(document.getElementById(\'ruleModal\'))">Abbrechen</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    }

    function renderCricketView(p, state) {
      if (!p) return '';
      const throws = Array.isArray(p.throws) ? p.throws : [];
      const currentRound = Array.isArray(p.currentRoundPoints) ? p.currentRoundPoints : [];
      const currentRoundThrows = throws.slice(-currentRound.length);
      const displayThrows = [...currentRound];
      while (displayThrows.length < 3) displayThrows.push(null);
      const cricketHits = p.cricketHits || {};
      const cricketClosed = p.cricketClosed || {};
      const cricketPoints = p.cricketPoints || 0;
      const nums = [15,16,17,18,19,20,25];
      
      // Zahlen-Grid mit visuellen Hit-Markern (wie TV)
      const gridHtml = nums.map(n => {
        const hits = cricketHits[n] || 0;
        const closed = !!cricketClosed[n];
        
        // Hit markers: 3 Kreise für Hit-Status
        const markers = [1, 2, 3].map(h => {
          let cls = 'hit-marker';
          if (closed) cls += ' closed';
          else if (hits >= h) cls += ' hit-' + h;
          return '<div class="' + cls + '"></div>';
        }).join('');
        
        return '<div class="cricket-num' + (closed ? ' closed' : '') + '">' +
          '<div class="num-label">' + n + '</div>' +
          '<div class="cricket-hits">' + markers + '</div>' +
        '</div>';
      }).join('');
      
      // Letzte Würfe
      const throwsHtml = displayThrows.map((points, index) => {
        const throwData = currentRoundThrows[index];
        const pointsLabel = points === null ? 'offen' : (points === 0 ? '0' : '+' + points);
        const segmentLabel = throwData && throwData.segment ? throwData.segment : (points === null ? '-' : String(points));
        return '<div class="throw-seg" style="--pc:' + escapeAttr(p.color || '#e63946') + '">' +
          '<div class="pts">' + pointsLabel + '</div>' +
          '<div class="seg">' + segmentLabel + '</div>' +
        '</div>';
      }).join('');
      
      const legStats = getLiveLegStats(p);
      
      return '<div class="focus-card" style="--pc:' + escapeAttr(p.color || '#e63946') + ';--pc-glow:' + colorToRgba(p.color || '#e63946', .18) + '">' +
        '<div class="focus-name"><span>🎯 ' + escapeHtml(p.name) + ' · Cricket</span><span class="focus-switch-timer"></span></div>' +
        '<div class="focus-kacheln">' +
          '<div class="focus-kachel">' +
            '<h4>Letzte Würfe</h4>' +
            '<div class="throw-segments">' + throwsHtml + '</div>' +
          '</div>' +
          '<div class="focus-kachel">' +
            '<div>' +
              '<h4>Cricket Punkte</h4>' +
              '<div class="focus-big-score">' + cricketPoints + '</div>' +
            '</div>' +
            '<div>' +
              '<h4>Zahlen</h4>' +
              '<div class="cricket-grid horizontal">' + gridHtml + '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="focus-summary"><div><span>Schnitt</span><strong>' + legStats.legAverage + '</strong></div><div><span>Erster-9-AVG</span><strong>' + legStats.firstNineAverage + '</strong></div><div><span>Checkout</span><strong>-</strong></div></div>' +
      '</div>';
    }

    function colorToRgba(hex, alpha) {
      const clean = String(hex || '#e63946').replace('#', '');
      if (clean.length !== 6) return 'rgba(230,57,70,' + alpha + ')';
      const r = parseInt(clean.slice(0, 2), 16);
      const g = parseInt(clean.slice(2, 4), 16);
      const b = parseInt(clean.slice(4, 6), 16);
      return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
    }

    // === VERBESSERTE kompakte Kachel für Cricket ===
    function renderCompactPlayer(p, mode, crowded) {
      const currentRound = Array.isArray(p.currentRoundPoints) ? p.currentRoundPoints : [];
      const lastThrows = Array.isArray(p.throws) ? p.throws.slice(-3).map(t => t.points) : [];
      const displayThrows = (Array.isArray(p.currentRoundPoints) && p.currentRoundPoints.length > 0) ? [...p.currentRoundPoints] : lastThrows;
      while (displayThrows.length < 3) displayThrows.push('-');
      const totalScored = p.totalScored || 0;
      const turns = p.turns || 0;
      const legAvg = turns > 0 ? (totalScored / turns * 3).toFixed(1) : '-';
      const isCricket = mode === 'cricket';
      const isElimination = mode === 'elimination';
      const displayScore = isCricket ? (p.totalScored || 0) : (isElimination ? (p.totalScored || 0) : p.remaining);
      const shortName = (p.name || '').length > 8 ? (p.name || '').substring(0, 8) + '...' : (p.name || '');

      const playerColor = escapeAttr(p.color || '#f4a261');
      
      let cricketGridHtml = '';
      let compactCricketHtml = '';
      if (isCricket) {
        const cricketHits = p.cricketHits || {};
        const cricketClosed = p.cricketClosed || {};
        const nums = [15, 16, 17, 18, 19, 20, 25];
        compactCricketHtml = '<div class="compact-cricket-status" aria-label="Cricket Status">' + nums.map(n => {
          const hits = cricketHits[n] || 0;
          const closed = !!cricketClosed[n];
          const label = n === 25 ? 'B' : n;
          return '<span class="' + (closed ? 'closed' : '') + '">' + label + ':' + (closed ? 'X' : hits) + '</span>';
        }).join('') + '</div>';
      }

      return '<div class="score-card' + (crowded && isCricket ? ' compact-crowded' : '') + '" data-tv style="--pc:' + playerColor + '">' +
        '<div class="sc-color-bar" style="--pc:' + playerColor + '"></div>' +
        '<div class="sc-name">P' + p.slot + ' · ' + escapeHtml(shortName) + '</div>' +
        '<div class="sc-score">' + displayScore + '</div>' +
        (compactCricketHtml || (isCricket ? cricketGridHtml : '')) +
        '<div class="sc-last-throws">' + displayThrows.map((pt) => '<span class="sc-throw-chip' + (pt === '-' ? ' empty' : '') + '">' + pt + '</span>').join('') + '</div>' +
      '</div>';
    }

    function calculateClientCricketPoints(player, allPlayers) {
      return Number(player.cricketPoints || player.totalScored || 0);
    }

    function isClientCricketWinner(player, allPlayers) {
      const closed = player.cricketClosed || {};
      const allClosed = [15, 16, 17, 18, 19, 20, 25].every(number => closed[number] === true);
      if (!allClosed) return false;
      const playerPoints = calculateClientCricketPoints(player, allPlayers);
      return allPlayers.every(opponent =>
        opponent.slot === player.slot || calculateClientCricketPoints(opponent, allPlayers) <= playerPoints
      );
    }

    function renderState(state) {
      if (!state || !Array.isArray(state.players) || state.players.length === 0) return;
      const activePlayer = state.game.activePlayer || 0;
      const mode = state.game.mode || '501';
      const active = state.players[activePlayer];
      const focusPlayer = document.getElementById('focusPlayer');
      const compactPlayers = document.getElementById('compactPlayers');

      // ── Sync buttons (Control-Kachel) ──
      const modeBtn = document.getElementById('ctrlModeBtn');
      const ruleBtn = document.getElementById('ctrlRuleBtn');
      const modeLabel = mode === '501' ? '501' : mode === '301' ? '301' : mode === '701' ? '701' : mode === 'cricket' ? 'Cricket' : mode === 'elimination' ? 'Elimination' : mode === 'shanghai' ? 'Shanghai' : mode === 'atc' ? 'ATC' : mode === 'split' ? 'Split' : mode;
      const ruleLabel = state.game.checkoutRule === 'single' ? 'Single Out' : state.game.checkoutRule === 'double' ? 'Double Out' : state.game.checkoutRule === 'master' ? 'Master Out' : state.game.checkoutRule;
      if (modeBtn) modeBtn.querySelector('.btn-value').textContent = modeLabel;
      if (ruleBtn) ruleBtn.querySelector('.btn-value').textContent = ruleLabel;

      // ── Bust detection ──
      const lastThrow = state.lastAction;
      if (state.game.mode === 'cricket' && lastThrow && Number(lastThrow.cricketPointsAwarded) > 0) {
        const animationKey = [lastThrow.ts, lastThrow.playerSlot, lastThrow.cricketPointsAwarded].join(':');
        if (animationKey !== lastCricketAnimationKey) {
          lastCricketAnimationKey = animationKey;
          showCricketScoreAnimation(lastThrow.cricketPointsAwarded);
        }
      }
      if (lastThrow && lastThrow.bust) {
        showBustOverlay(active);
        playBustSound();
      } else {
        hideBustOverlay();
      }

      // ── Elimination detection ──
      if (lastThrow && lastThrow.type === 'elimination') {
        const eliminatedPlayer = state.players.find(p => p.slot === lastThrow.playerSlot);
        const eliminatorPlayer = state.players.find(p => p.slot === lastThrow.eliminatedBySlot);
        if (eliminatedPlayer && eliminatorPlayer) {
          showEliminationOverlay(eliminatedPlayer, eliminatorPlayer);
          playEliminationSound();
        }
      } else {
        hideEliminationOverlay();
      }

      const isCricket = mode === 'cricket';
      const isElimination = mode === 'elimination';
      const hasOthers = state.players.length > 1;
      focusPlayer.classList.toggle('has-others', hasOthers);

      // ── DEBUG: Log Server State ──
      console.log('[Winner-Check] Server State:', {
        mode: state.game.mode,
        status: state.game.status,
        throwRound: state.game.throwRound,
        currentThrow: state.game.currentThrow,
        activePlayer: state.game.activePlayer,
        players: state.players.map(p => ({
          slot: p.slot,
          name: p.name,
          remaining: p.remaining,
          totalScored: p.totalScored,
          throws: p.throws?.length || 0,
          cricketClosed: p.cricketClosed,
          cricketHits: p.cricketHits,
          legs: p.legs
        }))
      });

      // Winner-Erkennung
      if (state.game.status !== 'leg-finished') {
        pendingWinner = null;
        hideWinnerOverlay();
      }
      let winner = null;
      if (isElimination) {
        // Bei Elimination: Kein Check auf remaining === 0 (alle starten bei 0!)
        // Gewinner wird serverseitig nach der zehnten vollständigen Aufnahme ermittelt
        if (state.game.status === 'leg-finished') {
          console.log('[Winner-Check] Elimination: leg-finished triggered');
          winner = state.players.find(p => p.slot === state.lastAction?.winnerSlot) ||
            state.players.reduce((a, b) => (a.legs || 0) > (b.legs || 0) ? a : b);
        }
      } else if (isCricket) {
        // Cricket: Server-Sieger bevorzugen, sonst nur bei geschlossenem Spiel und korrektem Punktevergleich.
        if (state.game.status === 'leg-finished') {
          winner = state.players.find(p => p.slot === state.lastAction?.winnerSlot) ||
            state.players.find(p => isClientCricketWinner(p, state.players));
        }
      } else {
        // x01 (501, 301, etc.): Winner hat remaining === 0
        winner = state.players.find(p => Number(p.remaining) === 0);
        if (!winner && state.game.status === 'leg-finished') {
          console.log('[Winner-Check] x01: leg-finished triggered');
          winner = state.players.reduce((a, b) => (a.legs || 0) > (b.legs || 0) ? a : b);
        }
      }

      if (winner && state.game.status === 'leg-finished') {
        pendingWinner = winner;
        showWinnerOverlay(winner, state);
      } else if (pendingWinner) {
        showWinnerOverlay(pendingWinner, state);
      } else {
        hideWinnerOverlay();
      }

      // Render der Kacheln
      if (isCricket) {
        focusPlayer.classList.remove('single');
        focusPlayer.innerHTML = renderCricketView(active, state) +
          '<div class="focus-right-col">' +
            renderFocusLegCard(active) +
            renderControlsCard(state) +
          '</div>';
      } else {
        focusPlayer.classList.remove('single');
        focusPlayer.innerHTML = renderFocusPlayer(active, activePlayer, state) +
          '<div class="focus-right-col">' +
            renderFocusLegCard(active) +
            renderControlsCard(state) +
          '</div>';
      }

      if (hasOthers) {
        const compactOrder = [...state.players]
          .filter((_p, idx) => idx !== activePlayer)
          .sort((a, b) => (Number(a.legs || 0) - Number(b.legs || 0)) || (Number(a.remaining || 0) - Number(b.remaining || 0)) || (Number(a.slot || 0) - Number(b.slot || 0)));
        compactPlayers.innerHTML = compactOrder
          .map((p) => renderCompactPlayer(p, mode, state.players.length >= 5)).join('');
      } else {
        compactPlayers.innerHTML = '';
      }

      startCountdown(state);
    }

    function playCricketScoreSound() {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        const ctx = new AudioContextClass();
        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(660, ctx.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(990, ctx.currentTime + 0.16);
        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.24);
        oscillator.connect(gain);
        gain.connect(ctx.destination);
        oscillator.start(ctx.currentTime);
        oscillator.stop(ctx.currentTime + 0.25);
        oscillator.addEventListener('ended', () => ctx.close());
      } catch {}
    }

    function createConfetti() {
      const container = document.getElementById('confettiContainer');
      if (!container) return;
      container.innerHTML = '';
      const colors = ['#f4a261', '#e63946', '#2a9d8f', '#457b9d', '#9b5de5', '#f77f00'];
      for (let i = 0; i < 80; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * 100 + '%';
        confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.animationDelay = (Math.random() * 2) + 's';
        confetti.style.animationDuration = (2 + Math.random() * 2) + 's';
        container.appendChild(confetti);
      }
    }

    // ── Vollbild ──
    function toggleFullscreen() {
      const doc = document;
      const docEl = doc.documentElement;
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      const isAndroid = /Android/.test(navigator.userAgent);
      const isTablet = isIOS || isAndroid || (navigator.maxTouchPoints && navigator.maxTouchPoints > 1);
      const isBrave = navigator.brave !== undefined || /brave/i.test(navigator.userAgent);

      console.log('[Fullscreen] Toggle called', {
        fullscreenElement: !!doc.fullscreenElement,
        webkitFullscreenElement: !!doc.webkitFullscreenElement,
        mozFullScreenElement: !!doc.mozFullScreenElement,
        msFullscreenElement: !!doc.msFullscreenElement,
        isSecureContext: window.isSecureContext,
        location: window.location.href,
        protocol: window.location.protocol,
        isIOS,
        isAndroid,
        isTablet,
        isBrave,
        standalone: window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches,
        userAgent: navigator.userAgent
      });

      // Bereits im Standalone-Modus (PWA) → nichts tun
      if (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) {
        showToast('Bereits im Vollbild-Modus (PWA)', false);
        return;
      }

      // Brave-spezifische Prüfung
      if (isBrave && !window.isSecureContext) {
        console.error('[Fullscreen] Brave: Not secure context (HTTP) - Fullscreen blocked');
        showToast('Brave: Fullscreen braucht HTTPS (oder localhost)', true);
        return;
      }

      if (!doc.fullscreenElement && !doc.webkitFullscreenElement && 
          !doc.mozFullScreenElement && !doc.msFullscreenElement) {
        const request = docEl.requestFullscreen || 
                        docEl.webkitRequestFullscreen || 
                        docEl.mozRequestFullScreen || 
                        docEl.msRequestFullscreen;
        if (request) {
          // iOS: requestFullscreen auf documentElement funktioniert NICHT
          // Nur auf Video-Elementen erlaubt
          if (isIOS) {
            console.warn('[Fullscreen] iOS detected - documentElement fullscreen not supported');
            showToast('iOS: "Zum Startbildschirm hinzufügen" für echten Vollbild-Modus', true);
            return;
          }
          
          request.call(docEl).then(() => {
            console.log('[Fullscreen] Entered successfully');
          }).catch(function(err) {
            console.error('[Fullscreen] Error:', err.name, err.message);
            
            // Brave-spezifische Fehlerbehandlung
            if (isBrave) {
              if (err.name === 'SecurityError') {
                showToast('Brave: Shields blockiert Fullscreen → Shields deaktivieren (Löwe-Icon)', true);
              } else if (err.name === 'TypeError') {
                showToast('Brave: Fullscreen API nicht verfügbar (HTTPS prüfen)', true);
              } else {
                showToast('Brave Fullscreen-Fehler: ' + err.message, true);
              }
            }
            // Tablet-spezifische Fehlerbehandlung
            else if (isTablet) {
              if (err.name === 'TypeError' || err.name === 'SecurityError') {
                showToast('Tablet: "Zum Startbildschirm hinzufügen" für Vollbild nutzen', true);
              } else {
                showToast('Vollbild nicht möglich: ' + err.message, true);
              }
            } else {
              showToast('Vollbild nicht möglich: ' + err.message, true);
            }
          });
        } else {
          showToast('Vollbild wird von diesem Browser nicht unterstützt', true);
        }
      } else {
        const exit = doc.exitFullscreen || 
                     doc.webkitExitFullscreen || 
                     doc.mozCancelFullScreen || 
                     doc.msExitFullscreen;
        if (exit) exit.call(doc);
      }
    }

    function updateFullscreenButton() {
      const btn = document.getElementById('fsBtn');
      if (!btn) return;
      const isFullscreen = !!(document.fullscreenElement || 
                              document.webkitFullscreenElement || 
                              document.mozFullScreenElement || 
                              document.msFullscreenElement);
      btn.title = isFullscreen ? 'Vollbild beenden (ESC)' : 'Vollbild aktivieren';
      if (isFullscreen) {
        btn.style.borderColor = '#f4a261';
        btn.style.color = '#f4a261';
      } else {
        btn.style.borderColor = '#444';
        btn.style.color = '#f1f1f1';
      }
    }

    document.addEventListener('fullscreenchange', updateFullscreenButton);
    document.addEventListener('webkitfullscreenchange', updateFullscreenButton);
    document.addEventListener('mozfullscreenchange', updateFullscreenButton);
    document.addEventListener('MSFullscreenChange', updateFullscreenButton);

    // ── Fehlwurf – nächster Spieler ──
    async function skipPlayer() {
      const btn = document.getElementById('focusMissBtn');
      if (btn) btn.disabled = true;
      try {
        const r = await fetch('/api/live/next-player', { method: 'POST' });
        if (!r.ok) { showToast('Wechsel fehlgeschlagen', true); if (btn) btn.disabled = false; return; }
        liveState = await r.json();
        renderState(liveState);
        showToast('➡ Fehlwurf – weiter mit ' + (liveState.players[liveState.game.activePlayer]?.name || 'nächstem Spieler'));
      } catch(e) { showToast('Netzwerkfehler', true); }
      if (btn) setTimeout(() => btn.disabled = false, 1000);
    }

    // ── Letzten Wurf zurücksetzen ──
    async function undoLastThrow() {
      const btn = document.getElementById('focusUndoBtn');
      if (!window.confirm('Den letzten Wurf wirklich zurücksetzen?')) return;
      if (btn) btn.disabled = true;
      try {
        const r = await fetch('/api/live/undo', { method: 'POST' });
        if (!r.ok) {
          showToast('Wurf konnte nicht zurückgesetzt werden', true);
          if (btn) btn.disabled = false;
          return;
        }
        liveState = await r.json();
        renderState(liveState);
        showToast('↶ Letzten Wurf zurückgesetzt');
      } catch(e) { showToast('Netzwerkfehler', true); }
      if (btn) setTimeout(() => btn.disabled = false, 1000);
    }

    // ── Täglicher Höchstwert ──
    let dailyHighscoreCache = null;
    async function loadDailyHighscore() {
      try {
        const r = await fetch('/api/highscores/daily');
        if (!r.ok) return;
        const data = await r.json();
        dailyHighscoreCache = data;
        renderDailyHighscore(data);
      } catch {}
    }
    function renderDailyHighscore(data) {
      const el = document.getElementById('dailyHsDisplay');
      if (!el) return;
      if (data && data.best) {
        el.querySelector('.hs-val').textContent = data.best.score + ' (' + data.best.player + ')';
        el.title = 'Heute: ' + data.count + ' Einträge · Bester: ' + data.best.player + ' mit ' + data.best.score;
      } else {
        el.querySelector('.hs-val').textContent = '–';
        el.title = data && data.count ? data.count + ' Einträge' : 'Keine Einträge heute';
      }
    }

    // ── Leg-Neustart ──
    async function restartLeg() {
      const btn = document.getElementById('restartLegBtn');
      if (btn) { btn.disabled = true; btn.textContent = '…'; }
      try {
        const r = await fetch('/api/live/reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ carryLegs: false })
        });
        if (!r.ok) { showToast('Neustart fehlgeschlagen', true); if (btn) { btn.disabled = false; btn.textContent = '↻ Leg-Neustart'; } return; }
        liveState = await r.json();
        pendingWinner = null;
        renderState(liveState);
        showToast('↻ Leg zurückgesetzt');
      } catch(e) { showToast('Netzwerkfehler', true); }
      if (btn) { btn.disabled = false; btn.textContent = '↻ Leg-Neustart'; }
    }

    // ── Spielmodus / Checkout-Regel ──
    async function loadGameModes() {
      try {
        const [modesRes, rulesRes, stateRes] = await Promise.all([
          fetch('/api/game/modes'),
          fetch('/api/game/checkout-rules'),
          fetch('/api/live/state')
        ]);
        if (stateRes.ok) {
          const state = await stateRes.json();
          const modeBtn = document.getElementById('ctrlModeBtn');
          const ruleBtn = document.getElementById('ctrlRuleBtn');
          const modeLabel = state.game.mode === '501' ? '501' : state.game.mode === '301' ? '301' : state.game.mode === '701' ? '701' : state.game.mode === 'cricket' ? 'Cricket' : state.game.mode === 'elimination' ? 'Elimination' : state.game.mode === 'shanghai' ? 'Shanghai' : state.game.mode === 'atc' ? 'ATC' : state.game.mode === 'split' ? 'Split' : state.game.mode;
          const ruleLabel = state.game.checkoutRule === 'single' ? 'Single Out' : state.game.checkoutRule === 'double' ? 'Double Out' : state.game.checkoutRule === 'master' ? 'Master Out' : state.game.checkoutRule;
          if (modeBtn) modeBtn.querySelector('.btn-value').textContent = modeLabel;
          if (ruleBtn) ruleBtn.querySelector('.btn-value').textContent = ruleLabel;
        }
      } catch {}
    }

    async function changeMode(mode) {
      try {
        const r = await fetch('/api/game/mode', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mode })
        });
        if (!r.ok) { showToast('Modus-Wechsel fehlgeschlagen', true); return; }
        liveState = await r.json();
        renderState(liveState);
        showToast('Modus: ' + mode);
      } catch(e) { showToast('Netzwerkfehler', true); }
    }

    async function changeCheckoutRule(rule) {
      try {
        const r = await fetch('/api/game/checkout-rule', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ rule })
        });
        if (!r.ok) { showToast('Regel-Wechsel fehlgeschlagen', true); return; }
        liveState = await r.json();
        renderState(liveState);
        showToast('Finish: ' + rule);
      } catch(e) { showToast('Netzwerkfehler', true); }
    }

    // ── Modal Functions ──
    function openModeModal() {
      const modal = document.getElementById('modeModal');
      const options = document.getElementById('modeOptions');
      if (!modal || !options) return;
      const modes = {
        '501': '501', '301': '301', '701': '701',
        'cricket': 'Cricket', 'elimination': 'Elimination',
        'shanghai': 'Shanghai', 'atc': 'ATC', 'split': 'Split'
      };
      const currentMode = liveState?.game?.mode || '501';
      options.innerHTML = Object.entries(modes).map(([key, label]) =>
        '<div class="modal-option' + (key === currentMode ? ' selected' : '') + '" onclick="selectMode(\'' + key + '\')">' + label + '</div>'
      ).join('');
      modal.classList.add('show');
    }

    function openRuleModal() {
      const modal = document.getElementById('ruleModal');
      const options = document.getElementById('ruleOptions');
      if (!modal || !options) return;
      const rules = {
        'double': 'Double Out', 'single': 'Single Out', 'master': 'Master Out'
      };
      const currentRule = liveState?.game?.checkoutRule || 'double';
      options.innerHTML = Object.entries(rules).map(([key, label]) =>
        '<div class="modal-option' + (key === currentRule ? ' selected' : '') + '" onclick="selectRule(\'' + key + '\')">' + label + '</div>'
      ).join('');
      modal.classList.add('show');
    }

    function closeModal(modal, event) {
      if (event && event.target !== modal) return;
      modal.classList.remove('show');
    }

    function selectMode(mode) {
      closeModal(document.getElementById('modeModal'));
      changeMode(mode);
    }

    function selectRule(rule) {
      closeModal(document.getElementById('ruleModal'));
      changeCheckoutRule(rule);
    }

    function playBustSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(80, ctx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.4);
      } catch {}
    }

    function playEliminationSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        // Dramatischerer Sound für Elimination - tiefer, länger
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.8);
        gain.gain.setValueAtTime(0.4, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.2);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 1.2);
      } catch {}
    }

    // ── State laden ──
    async function loadAll(retryAttempt = 0) {
      try {
        const stateRes = await fetch('/api/live/state');
        if (!stateRes.ok) throw new Error('HTTP ' + stateRes.status);
        const state = await stateRes.json();
        liveState = state;
        // Auto-Recovery NUR beim ersten Laden (nicht bei SSE-Updates)
        if (isFirstLoad && state.game.status === 'leg-finished') {
          isFirstLoad = false;
          try {
            const resetRes = await fetch('/api/live/reset', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ carryLegs: true })
            });
            if (resetRes.ok) {
              const freshState = await resetRes.json();
              liveState = freshState;
              const modeBtn2 = document.getElementById('ctrlModeBtn');
              const ruleBtn2 = document.getElementById('ctrlRuleBtn');
              const modeLabel2 = freshState.game.mode === '501' ? '501' : freshState.game.mode === '301' ? '301' : freshState.game.mode === '701' ? '701' : freshState.game.mode === 'cricket' ? 'Cricket' : freshState.game.mode === 'elimination' ? 'Elimination' : freshState.game.mode === 'shanghai' ? 'Shanghai' : freshState.game.mode === 'atc' ? 'ATC' : freshState.game.mode === 'split' ? 'Split' : freshState.game.mode;
              const ruleLabel2 = freshState.game.checkoutRule === 'single' ? 'Single Out' : freshState.game.checkoutRule === 'double' ? 'Double Out' : freshState.game.checkoutRule === 'master' ? 'Master Out' : freshState.game.checkoutRule;
              if (modeBtn2) modeBtn2.querySelector('.btn-value').textContent = modeLabel2;
              if (ruleBtn2) ruleBtn2.querySelector('.btn-value').textContent = ruleLabel2;
              renderState(freshState);
              showToast('↻ Neues Leg automatisch gestartet');
              return;
            }
          } catch {}
        }
        isFirstLoad = false;
        renderState(state);
      } catch(e) {
        console.error('[Live-State] Laden fehlgeschlagen', e);
        if (retryAttempt < 3) {
          document.getElementById('focusPlayer').innerHTML = '<div style="text-align:center;padding:40px;color:#f4a261">Verbinde mit Live-State … (' + (retryAttempt + 1) + '/3)</div>';
          setTimeout(() => loadAll(retryAttempt + 1), 1000);
          return;
        }
        document.getElementById('focusPlayer').innerHTML = '<div style="text-align:center;padding:40px;color:#e63946">⚠️ Live-State API nicht erreichbar<br><small>Bitte Verbindung oder Dashboard-Server prüfen.</small></div>';
      }
      // Daily Highscore parallel laden
      loadDailyHighscore();
    }

    loadGameModes();

    (function() {
      let sse = null;
      let reconnectAttempts = 0;
      const maxReconnectAttempts = 10;
      const baseReconnectDelay = 1000;

      function connectSSE() {
        sse = new EventSource('/api/events');
        
        sse.onopen = () => {
          console.log('[SSE] Connected');
          reconnectAttempts = 0;
        };

        sse.addEventListener('reload', () => {
          if (reloadQueued) return;
          reloadQueued = true;
          setTimeout(() => {
            reloadQueued = false;
            loadAll().catch(() => {});
          }, 120);
        });

        sse.onerror = (err) => {
          console.error('[SSE] Error:', err);
          sse.close();
          
          if (reconnectAttempts < maxReconnectAttempts) {
            reconnectAttempts++;
            const delay = baseReconnectDelay * Math.pow(2, reconnectAttempts - 1) + Math.random() * 1000;
            console.log(`[SSE] Reconnecting in ${Math.round(delay)}ms (attempt ${reconnectAttempts}/${maxReconnectAttempts})`);
            setTimeout(connectSSE, delay);
          } else {
            console.error('[SSE] Max reconnect attempts reached. Reloading page...');
            setTimeout(() => location.reload(), 5000);
          }
        };
      }

      let reloadQueued = false;
      connectSSE();
    })();

    loadAll();
  </script>
</body>
</html>
