<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <!-- PWA Meta Tags für "Zum Startbildschirm hinzufügen" -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dart Dashboard" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="manifest" href="/manifest.json" />
  <title>Live-Spielstand TV</title>
  <style>
    html { height: 100%; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a;
      color: #f1f1f1;
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      height: -webkit-fill-available;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      background: #111;
      border-bottom: 3px solid #e63946;
      padding: 7px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .topbar a { color: #888; text-decoration: none; font-size: .85rem; }
    .topbar a:hover { color: #fff; }
    .topbar-center { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: clamp(10px, 2vw, 28px); }
    .topbar h2 { font-size: 1rem; font-weight: 700; text-align: center; min-width: 0; white-space: nowrap; }
    .topbar-info { min-width: auto; font-size: .78rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; }
    .topbar-mode, .topbar-checkout { text-align: center; }
    .topbar-separator { color: #d7e0e5; font-size: 1.55rem; font-weight: 400; line-height: .7; }
    .topbar .clock { font-size: .9rem; font-weight: 600; color: #f4a261; font-variant-numeric: tabular-nums; min-width: 80px; text-align: center; }
    .topbar .fs-btn,
    .topbar .restart-btn {
      background: #1a1a1a;
      border: 1px solid #444;
      color: #f1f1f1;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: .78rem;
      font-family: inherit;
      transition: all .15s;
      white-space: nowrap;
    }
    .topbar .fs-btn:hover,
    .topbar .restart-btn:hover { background: #252525; border-color: #f4a261; color: #f4a261; }
    .topbar .restart-btn { border-color: #f4a261; color: #f4a261; }
    .daily-hs { font-size: .72rem; color: #f4a261; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 3px 10px; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
    .daily-hs .hs-label { color: #777; font-size: .6rem; text-transform: uppercase; letter-spacing: 1px; }
    .daily-hs .hs-val { font-weight: 800; font-variant-numeric: tabular-nums; }
    main {
      padding: 6px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-height: 0;
    }
    .focus-player {
      flex: 1;
      display: grid;
      grid-template-columns: 1.35fr .65fr;
      gap: 4px;
      align-items: stretch;
      min-height: 0;
    }
    .focus-player.single { grid-template-columns: 1fr; }
    .focus-player.has-others { flex: 1; max-height: 70%; min-height: 0; }

    .compact-players {
      display: flex;
      gap: 4px;
      flex: 0 0 clamp(112px, 16vh, 140px);
      height: clamp(112px, 16vh, 140px);
      max-height: none;
      min-height: 0;
    }
    .compact-players:empty { display: none; }
    .compact-players .score-card {
      flex: 1;
      height: 100%;
      min-width: 0;
      justify-content: flex-start;
      gap: 2px;
      padding: 4px 10px 4px;
      align-items: center;
      text-align: center;
    }
    .compact-players .score-card .sc-color-bar { margin-bottom: 1px; }
    .compact-players .score-card .sc-name { font-size: .78rem; }
    .compact-players .score-card .sc-score { font-size: 2rem; }
    .compact-players .score-card .sc-last-throws { margin-top: 0; }
    .compact-players .score-card .sc-last-throws,
    .compact-players .score-card .cricket-grid,
    .compact-players .score-card .compact-cricket-status { justify-content: center; margin-top: 0; margin-bottom: 0; }
    .compact-cricket-status {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 2px;
      width: 100%;
      margin: 1px 0;
    }
    .compact-cricket-status span {
      color: #aaa;
      background: #1b1b1b;
      border-radius: 4px;
      padding: 3px 1px;
      min-height: 18px;
      font-size: .52rem;
      font-weight: 700;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
    }
    .compact-cricket-status span.hit-1 { color: #071a14; background: #2a9d8f; }
    .compact-cricket-status span.hit-2 { color: #241700; background: #f4c542; }
    .compact-cricket-status span.closed { color: #fff; background: #e63946; font-weight: 900; }

    /* Countdown – immer mit fester Höhe, aber ausblendbar */
    #countdownDisplay {
      flex-shrink: 0;
      height: 0;
      text-align: center;
      padding: 0;
      background: transparent;
      border: 0;
      border-radius: 10px;
      color: #f4a261;
      font-weight: 700;
      font-size: .9rem;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      line-height: 20px;
      overflow: hidden;
    }
    #countdownDisplay.visible {
      height: 30px;
      padding: 4px 0;
      background: #1a1a1a;
      border: 1px solid #e63946;
      opacity: 1;
      pointer-events: auto;
    }

    .focus-card {
      background: linear-gradient(135deg, #191111, #141414);
      border-radius: 14px;
      padding: 10px;
      border: 2px solid var(--pc, #e63946);
      box-shadow: 0 0 30px rgba(230,57,70,.16);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }
    .focus-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 20% 10%, var(--pc-glow, rgba(230,57,70,.18)), transparent 35%);
      pointer-events: none;
    }
    .focus-card > * { position: relative; }
    .focus-name { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; margin-bottom: 2px; flex-shrink: 0; }
    .focus-title { justify-self: center; color: #f1f1f1; font-size: 1rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; white-space: nowrap; }
    .focus-mode-label { justify-self: start; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: #f4a261; font-size: .8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; white-space: nowrap; }
    .focus-checkout-label { justify-self: end; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: #2a9d8f; font-size: .8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; white-space: nowrap; }
    .focus-player-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 2px; min-width: 0; flex-shrink: 0; }
    .focus-player-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 2rem; font-weight: 800; white-space: nowrap; }
    .focus-switch-timer { display: inline-flex; visibility: hidden; justify-self: end; align-items: center; flex: 0 0 auto; color: #f4a261; background: rgba(244,162,97,.1); border: 1px solid rgba(244,162,97,.45); border-radius: 8px; padding: 6px 12px; font-size: .72rem; font-weight: 700; letter-spacing: .4px; white-space: nowrap; }
    .focus-switch-timer.visible { visibility: visible; }
    .focus-meta { color: #777; font-size: .68rem; margin-bottom: 4px; flex-shrink: 0; }
    .focus-kacheln {
      display: grid;
      grid-template-columns: 0.6fr 1.4fr;
      gap: 4px;
      flex: 1;
      min-height: 0;
    }
    .focus-kachel:nth-child(1) {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 0;
    }
    .focus-kachel:nth-child(2) {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 6px 8px;
      min-height: 0;
    }
    .focus-kachel:nth-child(2) > div {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      padding: 5px 6px;
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      min-height: clamp(9rem, 22vh, 12rem);
      position: relative;
    }
    .focus-kachel:nth-child(2) h4 {
      position: absolute;
      top: 5px;
      left: 5px;
      right: 5px;
      margin: 0;
      font-size: .6rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-align: center;
    }
    .focus-kachel {
      background: #0f0f0f;
      border: 1px solid #262626;
      border-radius: 11px;
      padding: 8px;
      min-height: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      position: relative;
    }
    .focus-kachel > h4 { position: absolute; top: 10px; left: 8px; right: 8px; color: #777; font-size: .6rem; letter-spacing: 1.5px; text-transform: uppercase; margin: 0; flex-shrink: 0; }
    .focus-kachel .subline { color: #555; font-size: .62rem; margin-top: 2px; flex-shrink: 0; }
    .throw-segments {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      max-width: 168px;
      flex: 1;
      justify-content: center;
    }
    .throw-seg {
      background: #164b3a;
      border: 1px solid #2a9d8f;
      border-radius: 10px;
      min-height: 155px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-weight: 800;
      padding: 2px 0;
      transition: background .25s ease, border-color .25s ease, box-shadow .25s ease;
    }
    .throw-seg.thrown {
      background: transparent;
      border-color: #2b2b2b;
      box-shadow: none;
    }
    .throw-seg .pts { font-size: 2.7rem; color: var(--pc, #e63946); }
    .throw-seg .seg { font-size: .95rem; color: #555; margin-top: 1px; }
    .throw-seg.bust { border-color: #e63946; background: #2a0a0a; box-shadow: 0 0 15px rgba(230,57,70,.4); }
    .throw-seg.bust .pts { color: #e63946; font-size: 2.52rem; }
    .throw-seg.bust .seg { color: #e63946; font-size: .8rem; }

    /* Bust-Overlay */
    .bust-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(230,57,70,.15);
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
      animation: bust-flash 0.6s ease-out;
    }
    .bust-overlay .bust-text {
      background: #e63946; color: #fff;
      font-size: 3rem; font-weight: 900;
      padding: 20px 50px; border-radius: 20px;
      text-transform: uppercase; letter-spacing: 4px;
      box-shadow: 0 0 60px rgba(230,57,70,.6);
      animation: bust-pulse 0.8s ease-in-out infinite alternate;
    }
    @keyframes bust-flash { 0% { opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes bust-pulse { from { transform: scale(1); } to { transform: scale(1.08); } }

    /* Elimination-Overlay */
    .elimination-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(139,0,0,.25);
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
      animation: elimination-flash 0.8s ease-out;
    }
    .elimination-overlay .elimination-text {
      background: linear-gradient(135deg, #8b0000, #ff0000); color: #fff;
      font-size: 3.5rem; font-weight: 900;
      padding: 30px 60px; border-radius: 25px;
      text-transform: uppercase; letter-spacing: 6px;
      box-shadow: 0 0 80px rgba(255,0,0,.8), 0 0 160px rgba(139,0,0,.6);
      animation: elimination-pulse 0.6s ease-in-out infinite alternate;
      text-shadow: 0 0 20px rgba(255,255,255,.5);
    }
    @keyframes elimination-flash { 0% { opacity: 0; transform: scale(0.8); } 15% { opacity: 1; transform: scale(1.05); } 85% { opacity: 1; } 100% { opacity: 0; transform: scale(1.1); } }
    @keyframes elimination-pulse { from { transform: scale(1); box-shadow: 0 0 80px rgba(255,0,0,.8), 0 0 160px rgba(139,0,0,.6); } to { transform: scale(1.1); box-shadow: 0 0 120px rgba(255,0,0,1), 0 0 240px rgba(139,0,0,.8); } }

    .cricket-score-animation {
      position: fixed;
      top: 42%;
      left: 50%;
      z-index: 9998;
      color: #f4a261;
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 900;
      text-shadow: 0 0 20px rgba(244,162,97,.8);
      pointer-events: none;
      animation: cricket-score-pop 1.1s ease-out forwards;
    }
    @keyframes cricket-score-pop {
      0% { opacity: 0; transform: translate(-50%, 20px) scale(.7); }
      20% { opacity: 1; transform: translate(-50%, 0) scale(1.15); }
      100% { opacity: 0; transform: translate(-50%, -70px) scale(1); }
    }

    .focus-big-score {
      font-size: clamp(11.4rem, 13.2vw, 14.4rem);
      font-weight: 900;
      line-height: 1;
      color: var(--pc, #f4a261);
      font-variant-numeric: tabular-nums;
      overflow: visible;
      white-space: nowrap;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .focus-summary {
      margin-top: 4px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      flex-shrink: 0;
    }
    .focus-summary div { background: #141414; border-radius: 10px; padding: 4px; text-align: center; }
    .focus-summary span { display: block; color: #666; font-size: .5rem; text-transform: uppercase; letter-spacing: 1px; }
    .focus-summary strong { display: block; color: #f1f1f1; font-size: .78rem; margin-top: 1px; }

    /* Leg-Liste – feste Höhe (25% reduziert) */
    .focus-leg-card {
      background: #141414;
      border-radius: 14px;
      padding: 5px;
      border: 2px solid #1e1e1e;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
      flex-shrink: 0;
      /* Höhe: h4 (~18px) + gap (4px) + leg-list max-height (285px) + padding (10px) = ~317px */
      height: 317px;
    }
    .focus-leg-card h4 {
      color: #777;
      font-size: .56rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-align: center;
      flex-shrink: 0;
    }
    .focus-right-col {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 0;
      overflow: hidden;
    }
    .focus-controls-card {
      background: #141414;
      border-radius: 14px;
      padding: 6px 10px;
      border: 2px solid #1e1e1e;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex-shrink: 0;
      height: 236px !important;
    }
    .focus-controls-card .ctrl-title {
      color: #777;
      font-size: .52rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-align: center;
    }
    .focus-controls-card .ctrl-row {
      display: flex;
      gap: 4px;
      align-items: stretch;
      flex: 1;
    }
    .focus-controls-card .ctrl-choice {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
      align-items: stretch;
    }
    .focus-controls-card .ctrl-choice-label {
      flex: 0 0 auto;
      color: #888;
      font-size: .5rem;
      letter-spacing: 1px;
      text-align: center;
      text-transform: uppercase;
    }
    .focus-controls-card .ctrl-row.action-row {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: 4px;
    }
    .focus-controls-card .ctrl-btn {
      flex: 1;
      padding: 24px 8px;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #2a2a2a;
      background: #1a1a1a;
      color: #f1f1f1;
      font-size: .82rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all .15s;
      text-align: center;
      min-height: 52px !important;
      height: 100% !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }
    .focus-controls-card .ctrl-btn:hover { border-color: #f4a261; color: #f4a261; }
    .focus-controls-card .ctrl-btn.miss { border-color: #e63946; background: #8b0000; }
    .focus-controls-card .ctrl-btn.miss:hover { background: #a00; border-color: #f4a261; color: #f4a261; }
    .focus-controls-card .ctrl-btn.miss,
    .focus-controls-card .ctrl-btn.undo {
      font-size: 1.20rem !important;
    }
    .focus-controls-card .ctrl-btn.miss { grid-row: 1 / span 2; }
    .focus-controls-card .ctrl-btn.mode-btn { border-color: #457b9d; }
    .focus-controls-card .ctrl-btn.mode-btn:hover { border-color: #6fa8c7; color: #d9f0ff; }
    .focus-controls-card .ctrl-btn.rule-btn.rule-single { border-color: #2a9d8f; }
    .focus-controls-card .ctrl-btn.rule-btn.rule-single:hover { border-color: #63c9bb; color: #bff5ed; }
    .focus-controls-card .ctrl-btn.rule-btn.rule-master { border-color: #f4c542; }
    .focus-controls-card .ctrl-btn.rule-btn.rule-master:hover { border-color: #ffe27a; color: #fff0ae; }
    .focus-controls-card .ctrl-btn.rule-btn.rule-double { border-color: #e63946; }
    .focus-controls-card .ctrl-btn.rule-btn.rule-double:hover { border-color: #ff7a83; color: #ffd6d9; }
    .focus-controls-card .ctrl-btn.undo { border-color: #f4c542; background: #f4c542; color: #241700; }
    .focus-controls-card .ctrl-btn.undo:hover { border-color: #ffe27a; background: #ffe27a; color: #241700; }
    .focus-controls-card .ctrl-btn.restart { border-color: #f4a261; color: #f4a261; }
    .focus-controls-card .ctrl-btn.restart:hover { border-color: #e63946; color: #e63946; }
    .focus-controls-card .ctrl-btn.restart.match-kind-single,
    .topbar .fs-btn.match-kind-single { border-color: #2a9d8f; color: #2a9d8f; }
    .focus-controls-card .ctrl-btn.restart.match-kind-single:hover,
    .topbar .fs-btn.match-kind-single:hover { border-color: #63c9bb; color: #bff5ed; }
    .focus-controls-card .ctrl-btn.restart.match-kind-duel,
    .topbar .fs-btn.match-kind-duel { border-color: #e63946; color: #ff7a83; }
    .focus-controls-card .ctrl-btn.restart.match-kind-duel:hover,
    .topbar .fs-btn.match-kind-duel:hover { border-color: #ff9aa0; color: #ffd6d9; }
    .focus-controls-card .ctrl-btn.restart.match-kind-group,
    .topbar .fs-btn.match-kind-group { border-color: #457b9d; color: #6fa8c7; }
    .focus-controls-card .ctrl-btn.restart.match-kind-group:hover,
    .topbar .fs-btn.match-kind-group:hover { border-color: #9bc9e2; color: #d9f0ff; }
    .focus-controls-card .ctrl-btn.restart.match-kind-tournament,
    .topbar .fs-btn.match-kind-tournament { border-color: #f4c542; color: #f4c542; }
    .focus-controls-card .ctrl-btn.restart.match-kind-tournament:hover,
    .topbar .fs-btn.match-kind-tournament:hover { border-color: #ffe27a; color: #fff0ae; }
    .focus-controls-card .ctrl-btn:disabled { opacity: .4; cursor: default; }
    
    /* Mode/Rule Buttons - gleiche Höhe, nur Label/Value Styling */
    .focus-controls-card .ctrl-btn.mode-btn,
    .focus-controls-card .ctrl-btn.rule-btn {
      width: 100%;
      padding: 8px 4px;
      justify-content: center;
      height: 90% !important;
      align-self: center;
    }
    .focus-controls-card .ctrl-btn .btn-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f4a261;
      margin: 0;
    }
    
    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.show {
      display: flex;
      opacity: 1;
    }
    .modal-content {
      background: #1a1a1a;
      border: 2px solid #e63946;
      border-radius: 16px;
      padding: 20px;
      min-width: 280px;
      max-width: 90vw;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 0 40px rgba(230,57,70,.4);
      transform: scale(0.9);
      transition: transform 0.2s ease;
    }
    .modal-overlay.show .modal-content {
      transform: scale(1);
    }
    .modal-content h4 {
      color: #f4a261;
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-align: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #333;
    }
    .modal-options {
      display: grid;
      gap: 8px;

    /* === NEU: Cricket‑Grid für kompakte Kacheln === */

    /* Winner Overlay */
    .winner-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .winner-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .winner-card {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border: 3px solid #f4a261;
      border-radius: 24px;
      padding: 40px 60px;
      text-align: center;
      box-shadow: 0 0 60px rgba(244, 162, 97, 0.4), 0 20px 40px rgba(0,0,0,0.5);
      transform: scale(0.9);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .winner-overlay.show .winner-card {
      transform: scale(1);
    }
    .winner-icon {
      font-size: 4rem;
      margin-bottom: 16px;
      animation: bounce 1s ease infinite;
    }
    .winner-subtitle {
      font-size: 1.2rem;
      color: #aaa;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .winner-name {
      font-size: 3rem;
      font-weight: 900;
      color: #f4a261;
      margin-bottom: 16px;
      text-shadow: 0 0 30px rgba(244, 162, 97, 0.6);

    .winner-stats {
      display: flex;
      flex-wrap: wrap;

      justify-content: center;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid rgba(244, 162, 97, 0.3);

    .winner-stat {
      text-align: center;

    .winner-stat-label {
      font-size: 0.8rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .winner-stat-value {
      font-size: 1.8rem;
      font-weight: 800;
      color: #f4a261;
    }
    .winner-btn {
      background: linear-gradient(135deg, #f4a261, #e63946);

      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1a1a1a;
      color: #f1f1f1;
      padding: 12px 28px;
      border-radius: 12px;
      border: 1px solid #333;
      font-size: .9rem;
      opacity: 0;
      transition: opacity .3s ease, transform .3s ease;
      z-index: 9999;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }
    .toast.err {
      border-color: #e63946;
      color: #e63946;
    }

    .confetti-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 10001;
    }
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      top: -10px;
      animation: confetti-fall 3s linear forwards;
    }
    @keyframes confetti-fall {
      to {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
      }
    }

      .throw-seg { min-height: 70px; }
      .throw-seg .pts { font-size: 1.98rem; }

      .focus-big-score { font-size: clamp(6rem, 13.2vw, 9.36rem); }
      .focus-summary { margin-top: 2px; }
      .focus-summary div { padding: 3px; }
      .focus-summary span { font-size: .4rem; }
      .focus-summary strong { font-size: .65rem; }
      .focus-player.has-others { flex: 1; }
      .focus-leg-card { display: none; }
      .compact-players { gap: 3px; flex-basis: 128px; height: 128px; max-height: none; }

      .compact-players .score-card .sc-color-bar { width: 3px; height: 28px; align-self: center; flex-shrink: 0; border-radius: 2px; }
      .compact-players .score-card .sc-name { font-size: .6rem; white-space: nowrap; flex-shrink: 0; }

      .compact-players .score-card .sc-stats { font-size: .45rem; white-space: nowrap; flex-shrink: 0; }
      .compact-players .score-card .sc-last-throws { flex-shrink: 0; }
      .compact-players .score-card .sc-throw-chip { font-size: .5rem; padding: 1px 3px; min-width: 14px; border-radius: 4px; }
      .compact-players .score-card.compact-crowded { flex-direction: column; align-items: center; }
        .compact-players .score-card.compact-crowded {
          justify-content: flex-start;
          gap: 2px;
          padding: 4px 8px 3px;
        }
        .compact-players .score-card.compact-crowded .sc-color-bar { width: 100%; height: 3px; margin-bottom: 2px; }
        .compact-players .score-card.compact-crowded .sc-score { line-height: .9; }
      .compact-players .score-card.compact-crowded .compact-cricket-status { font-size: .42rem; }
      /* Cricket-Grid für die kompakte Zeile */
      .compact-players .score-card .cricket-grid {
        gap: 4px 6px;
        margin: 4px 0;
      }
      .compact-players .score-card .cricket-num {

        gap: 2px;

      .compact-players .score-card .num-label {

      .compact-players .score-card .hit-marker {

        height: 14px;

      .compact-players .score-card .hit-marker.hit-1,
      .compact-players .score-card .hit-marker.hit-2,
      .compact-players .score-card .hit-marker.hit-3 {

      .focus-controls-card .ctrl-title { font-size: .42rem; }
      .focus-controls-card .ctrl-btn { font-size: .65rem; padding: 16px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
      .focus-controls-card { display: none; height: 236px !important; }
    }

    /* Tablet-Auflösungen – Buttons hoch genug */
    @media (min-width: 768px) and (max-width: 1600px) and (min-height: 600px) {
      :root {
        --tablet-menu-control-height: 52px;
        --tablet-player-tile-height: 52px;
      }
      .focus-controls-card { height: 236px !important; }
      .focus-controls-card .ctrl-btn { padding: 24px 8px !important; min-height: 52px !important; height: 100% !important; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: .82rem; }
      .match-menu-field { font-size: .82rem; }
      .match-menu-field select, .match-menu-field input:not([type="checkbox"]) { min-height: var(--tablet-menu-control-height); padding: 13px 12px; font-size: .9rem; }
      .match-player-option { min-height: var(--tablet-player-tile-height); }
    }

    /* Fallback für alle Touch-Geräte */
    @media (pointer: coarse) {
      .focus-player.has-others { max-height: none; }
      .focus-player.single { grid-template-rows: minmax(0, 1fr) auto; }
      .focus-card { min-height: 0; padding: 6px; }
      .focus-name { font-size: 1.5rem; }
      .focus-big-score { font-size: clamp(6rem, 9.6vw, 9.6rem); }
      .match-menu-field { font-size: .82rem; }
      .match-menu-field select, .match-menu-field input:not([type="checkbox"]) { min-height: var(--tablet-menu-control-height, 52px); padding: 13px 12px; font-size: .9rem; }
      .match-player-option { min-height: var(--tablet-player-tile-height, 52px); }
      .focus-controls-card { height: 236px !important; }
      .focus-controls-card .ctrl-btn { min-height: 52px !important; padding: 24px 8px !important; height: 100% !important; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: .82rem; }
    }

    @media (min-width: 768px) and (max-width: 1600px) and (min-height: 600px) and (max-height: 1024px) {
      .focus-player.has-others { max-height: none; }
      .focus-player.single { grid-template-rows: minmax(0, 1fr) auto; }
      .focus-card { min-height: 0; padding: 6px; }
      .focus-name { font-size: 1.5rem; }
      .focus-big-score { font-size: clamp(6rem, 9.6vw, 9.6rem); }
    }
  </style>
</head>
<body>
  <!-- Winner Overlay -->
  <div class="winner-overlay" id="winnerOverlay"></div>
  <div class="duel-stats-overlay" id="duelStatsOverlay"></div>
  <div class="leg-start-overlay" id="legStartOverlay" role="dialog" aria-modal="true" aria-labelledby="legStartTitle"></div>
  <div class="match-menu-overlay" id="matchMenuOverlay" role="dialog" aria-modal="true" aria-labelledby="matchMenuTitle">
    <div class="match-menu-card">
      <h3 id="matchMenuTitle">Begegnung starten</h3>
      <p id="matchMenuDescription">Wähle Begegnungstyp, Best-of, Finish und Teilnehmer. Die Duellstatistik und Heatmap werden für alle Legs und Spieler geführt.</p>
      <div class="match-menu-grid">
        <label class="match-menu-field full">Startart
          <select id="matchStartKind" onchange="updateMatchStartKind()"><option value="encounter">Begegnung mit Statistik</option><option value="single">Einzelspiel ohne Begegnungsstatistik</option></select>
        </label>
        <label class="match-menu-field encounter-only">Typ
          <select id="matchTypeSelect"><option value="direct">Direktes Duell</option><option value="group">Mehrspielerbegegnung</option><option value="tournament">K.-o.-Turnier</option></select>
        </label>
        <label class="match-menu-field encounter-only">Best-of
          <select id="matchBestOf"><option value="1">Einzelleg</option><option value="3">Best of 3</option><option value="5">Best of 5</option><option value="7">Best of 7</option><option value="9">Best of 9</option></select>
        </label>
        <label class="match-menu-field">Spiel
          <select id="matchMode"><option value="501">501</option><option value="301">301</option><option value="701">701</option><option value="cricket">Cricket</option><option value="elimination">301-Elimination</option><option value="shanghai">Shanghai</option><option value="atc">Around the Clock</option><option value="split">Split</option></select>
        </label>
        <label class="match-menu-field encounter-only">Finish
          <select id="matchCheckoutRule"><option value="double">Double Out</option><option value="single">Single Out</option><option value="master">Master Out</option></select>
        </label>
        <label class="match-menu-field encounter-only" id="tournamentNameField" hidden>Turniername
          <input id="matchTournamentName" type="text" maxlength="80" placeholder="z. B. Freitagsturnier" />
        </label>
        <div class="match-menu-field full">Teilnehmer
          <div class="match-player-list" id="matchPlayerList"></div>
        </div>
      </div>
      <div class="match-menu-actions"><button type="button" onclick="closeMatchMenu()">Abbrechen</button><button class="primary" id="matchStartButton" type="button" onclick="startConfiguredMatch()">Begegnung starten</button></div>
    </div>
  </div>
  
  <!-- Toast -->
  <div class="toast" id="toast"></div>
  
  <div class="topbar">
    <a href="/" title="Zurück zur Übersicht">← Zurück</a>
    <div class="topbar-center">
      <span class="topbar-info topbar-mode" id="topbarModeInfo">501</span>
      <span class="topbar-separator" aria-hidden="true">·</span>
      <h2>🎯 Live-Spielstand</h2>
      <span class="topbar-separator" aria-hidden="true">·</span>
      <span class="topbar-info topbar-checkout" id="topbarCheckoutInfo">Double-Out</span>
    </div>
    <button class="fs-btn" id="fsBtn" onclick="toggleFullscreen()" title="Vollbild aktivieren">⛶</button>
    <div class="daily-hs" id="dailyHsDisplay" title="Heutiger Höchstwert"><span class="hs-label">Heute</span><span class="hs-val">–</span></div>
  </div>

  <main>
    <section class="tournament-bracket" id="tournamentBracket"></section>
    <section class="focus-player" id="focusPlayer"><div style="text-align:center;padding:40px;color:#555">Lade Spieler...</div></section>
    <section class="compact-players" id="compactPlayers"></section>
    <!-- Countdown – immer im DOM, feste Höhe, Sichtbarkeit über Klasse -->
    <div id="countdownDisplay">Nächster Spieler in 5s</div>
  </main>
  <div class="tournament-bracket-overlay" id="tournamentBracketOverlay" role="dialog" aria-modal="true" aria-labelledby="tournamentBracketTitle">
    <section class="tournament-bracket" id="tournamentBracketOverlayContent"></section>
  </div>

  <script>
    let liveState = null;
    let countdownTimer = null;
    let pendingWinner = null;
    let isFirstLoad = true;
    let lastCricketAnimationKey = '';
    let duelStatsTimer = null;
    let duelStatsScheduledFor = '';
    let duelStatsVisibleFor = '';
    let duelStatsCache = null;
    let duelStatsCacheKey = '';
    let duelStatsRenderState = null;
    let duelStatsLegIndex = -1;
    let legStartTimer = null;
    let legStartRemaining = 0;
    let tournamentIntroKey = '';
    let tournamentBracketKey = '';
    let tournamentBracketRequest = null;
    let duelStatsEnabled = localStorage.getItem('liveDuelStatsEnabled') !== 'false';

    function startCountdown(state) {
      if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
      const action = state && state.lastAction;
      const el = document.querySelector('.focus-switch-timer') || document.getElementById('countdownDisplay');
      if (!action || !action.autoAdvancePending || !action.autoAdvanceDelayMs) {
        if (el) { el.classList.remove('visible'); el.textContent = ''; }
        return;
      }
      const startedAt = action.autoAdvanceStartedAt || Date.now();
      const delayMs = action.autoAdvanceDelayMs;
      countdownTimer = setInterval(() => {
        const elapsed = Date.now() - startedAt;
        const remaining = Math.max(0, delayMs - elapsed);
        if (remaining <= 0) {
          if (el) { el.classList.remove('visible'); el.textContent = ''; }
          if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
          return;
        }
        if (el) {
          el.classList.add('visible');
          el.textContent = 'Nächster Spieler in ' + Math.ceil(remaining / 1000) + 's';
        }
      }, 200);
    }

    function escapeHtml(str) { if (!str) return ''; return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function escapeAttr(str) { if (!str) return ''; return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function getPointsPerAufnahme(player) {
      const currentRound = Array.isArray(player && player.currentRoundPoints) ? player.currentRoundPoints : [];
      if (currentRound.length > 0) {
        return currentRound.reduce((sum, pt) => sum + (Number(pt) || 0), 0);
      }
      return 0;
    }

    function getLiveLegStats(player) {
      const throws = Array.isArray(player && player.throws) ? player.throws : [];
      const darts = Number(player && player.turns) || throws.length;
      const totalScored = Number(player && player.totalScored) || 0;
      const legAverage = darts > 0 ? (totalScored / darts * 3).toFixed(1) : '-';
      const firstNine = throws.slice(0, 9);
      const firstNineScore = firstNine.reduce((sum, item) => sum + (item && item.bust ? 0 : (Number(item && item.points) || 0)), 0);
      const firstNineAverage = firstNine.length >= 9 ? (firstNineScore / 9 * 3).toFixed(1) : '-';
      const checkoutAttempts = Number(player && player.checkoutAttempts) || 0;
      const checkoutSuccess = Number(player && player.checkoutSuccess) || 0;
      const checkout = checkoutAttempts > 0 ? ((checkoutSuccess / checkoutAttempts) * 100).toFixed(1) + '%' : '-';
      return { legAverage, firstNineAverage, checkout };
    }

    function isDuelStatsEligible(state) {
      return state && state.game && ['501', '301', '701'].includes(String(state.game.mode)) && Number(state.game.duelId) > 0 && Array.isArray(state.players) && state.players.length >= 2;
    }

    function hasActiveMatch(state) {
      if (!state || !state.game || Number(state.game.duelId) <= 0) return false;
      if (String(state.game.status) === 'running') return true;
      if (String(state.game.status) !== 'leg-finished') return false;
      const winner = Array.isArray(state.players)
        ? state.players.find(player => Number(player.slot) === Number(state.lastAction && state.lastAction.winnerSlot))
        : null;
      return !isMatchComplete(state, winner);
    }

    function isMatchComplete(state, winner) {
      const legsToWin = Math.max(1, Number(state && state.game && state.game.legsToWin || 1));
      return Number(winner && winner.legs || 0) >= legsToWin;
    }

    function openMatchMenu() {
      if (hasActiveMatch(liveState)) {
        if (confirm('Die laufende Begegnung wirklich abbrechen? Die bisherige Begegnung bleibt in der Statistik erhalten.')) abortActiveMatch();
        return;
      }
      const modeSelect = document.getElementById('matchMode');
      const checkoutSelect = document.getElementById('matchCheckoutRule');
      if (modeSelect && liveState && liveState.game) modeSelect.value = liveState.game.mode || '501';
      if (checkoutSelect && liveState && liveState.game) checkoutSelect.value = liveState.game.checkoutRule || 'double';
      document.getElementById('matchStartKind').value = 'encounter';
      updateMatchStartKind();
      document.getElementById('matchMenuOverlay').classList.add('open');
      loadMatchPlayers();
    }

    function updateMatchStartKind() {
      const isSingleGame = document.getElementById('matchStartKind').value === 'single';
      document.querySelectorAll('.encounter-only').forEach(field => { field.hidden = isSingleGame; });
      document.getElementById('matchMenuDescription').textContent = isSingleGame
        ? 'Starte ein einzelnes Spiel mit einem beliebigen Modus und den ausgewählten Spielern. Es wird keine Begegnung in der Statistik angelegt.'
        : 'Wähle Begegnungstyp, Best-of, Finish und Teilnehmer. Die Duellstatistik und Heatmap werden für alle Legs und Spieler geführt.';
      document.getElementById('matchStartButton').textContent = isSingleGame ? 'Einzelspiel starten' : 'Begegnung starten';
    }

    function getMatchActionPresentation(state) {
      const game = state && state.game ? state.game : {};
      const isSingleGame = Number(game.duelId || 0) <= 0;
      const matchType = String(game.matchType || 'direct');
      if (isSingleGame) return { label: 'Einzelspiel läuft', title: 'Laufendes Einzelspiel', className: 'match-kind-single' };
      if (matchType === 'tournament') return { label: 'Turnier läuft', title: 'Laufende Turnierbegegnung', className: 'match-kind-tournament' };
      if (matchType === 'group') return { label: 'Mehrspieler läuft', title: 'Laufende Mehrspielerbegegnung', className: 'match-kind-group' };
      return { label: 'Duell läuft', title: 'Laufendes Duell', className: 'match-kind-duel' };
    }

    async function loadMatchPlayers() {
      const list = document.getElementById('matchPlayerList');
      if (!list) return;
      list.innerHTML = '<div class="match-player-loading">Spieler werden geladen ...</div>';
      try {
        const response = await fetch('/api/players', { cache: 'no-store' });
        if (!response.ok) throw new Error('Spieler konnten nicht geladen werden');
        const players = (await response.json()).filter(player => player && player.active !== false && String(player.name || '').trim());
        const selectedSlots = Array.isArray(liveState && liveState.game && liveState.game.selectedPlayerSlots)
          ? liveState.game.selectedPlayerSlots.map(Number)
          : (Array.isArray(liveState && liveState.players) ? liveState.players.map(player => Number(player.slot)) : []);
        list.innerHTML = players.map(player => '<label class="match-player-option"><input type="checkbox" value="' + Number(player.slot) + '"' + (selectedSlots.includes(Number(player.slot)) ? ' checked' : '') + ' /><span>' + escapeHtml(player.name) + '</span></label>').join('');
        document.getElementById('matchTypeSelect').value = selectedSlots.length === 2 ? 'direct' : 'group';
        updateMatchMenuType();
      } catch (error) {
        list.innerHTML = '<div class="match-player-loading">Spieler konnten nicht geladen werden.</div>';
        showToast(error.message, true);
      }
    }

    function closeMatchMenu() { document.getElementById('matchMenuOverlay').classList.remove('open'); }

    async function abortActiveMatch() {
      const button = document.getElementById('duelStatsToggle');
      if (button) button.disabled = true;
      try {
        const response = await fetch('/api/duels/' + encodeURIComponent(liveState.game.duelId) + '/cancel', { method: 'POST' });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || 'HTTP ' + response.status);
        liveState = payload.state;
        pendingWinner = null;
        hideWinnerOverlay();
        hideDuelStatsOverlay();
        renderState(liveState);
        showToast('Begegnung abgebrochen');
      } catch (error) {
        showToast('Begegnung konnte nicht abgebrochen werden: ' + error.message, true);
      } finally {
        if (button) button.disabled = false;
      }
    }

    function updateMatchMenuType() {
      const type = document.getElementById('matchTypeSelect').value;
      const isSingleGame = document.getElementById('matchStartKind').value === 'single';
      document.getElementById('tournamentNameField').hidden = isSingleGame || type !== 'tournament';
      document.querySelectorAll('#matchPlayerList input').forEach(input => { input.disabled = false; });
    }

    async function startConfiguredMatch() {
      const startKind = document.getElementById('matchStartKind').value;
      const type = document.getElementById('matchTypeSelect').value;
      const playerSlots = Array.from(document.querySelectorAll('#matchPlayerList input:checked')).map(input => Number(input.value));
      if ((startKind === 'encounter' && ((type === 'direct' && playerSlots.length !== 2) || (type === 'tournament' && ![2, 4, 8, 16].includes(playerSlots.length)) || playerSlots.length < 2)) || (startKind === 'single' && playerSlots.length < 1)) { showToast(startKind === 'single' ? 'Bitte mindestens einen Spieler auswählen.' : type === 'tournament' ? 'Ein K.-o.-Turnier benötigt 2, 4, 8 oder 16 Spieler.' : 'Bitte die passende Anzahl Spieler auswählen.', true); return; }
      try {
        const endpoint = startKind === 'single' ? '/api/live/start' : '/api/duels/start';
        const body = startKind === 'single'
          ? { mode: document.getElementById('matchMode').value, checkoutRule: document.getElementById('matchCheckoutRule').value, playerSlots }
          : { matchType: type, mode: document.getElementById('matchMode').value, checkoutRule: document.getElementById('matchCheckoutRule').value, bestOf: Number(document.getElementById('matchBestOf').value), playerSlots, tournamentName: document.getElementById('matchTournamentName').value.trim() };
        const response = await fetch(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || 'HTTP ' + response.status);
        closeMatchMenu();
        liveState = payload;
        pendingWinner = null;
        hideWinnerOverlay();
        renderState(liveState);
        if (type === 'tournament') {
          const bracketOverlay = document.getElementById('tournamentBracketOverlay');
          if (bracketOverlay) bracketOverlay.classList.add('show');
          tournamentBracketKey = '';
          tournamentBracketRequest = null;
          renderTournamentBracket(liveState, true);
        }
        showToast(startKind === 'single' ? 'Einzelspiel gestartet' : 'Begegnung gestartet');
      } catch (error) { showToast('Begegnung konnte nicht gestartet werden: ' + error.message, true); }
    }

    function getDuelStatsKey(state) {
      return isDuelStatsEligible(state) ? String(state.game.duelId) + ':' + String(state.game.status) + ':' + String(state.game.updatedAt || '') : '';
    }

    function updateDuelStatsToggle(state) {
      const button = document.getElementById('duelStatsToggle');
      if (!button) return;
      const eligible = isDuelStatsEligible(state);
      const activeMatch = hasActiveMatch(state);
      const presentation = getMatchActionPresentation(state);
      const isRunningGame = activeMatch || (state && state.game && state.game.status === 'running');
      button.disabled = false;
      button.classList.toggle('active', eligible && duelStatsEnabled);
      button.classList.remove('match-kind-single', 'match-kind-duel', 'match-kind-group', 'match-kind-tournament');
      if (isRunningGame) button.classList.add(presentation.className);
      button.textContent = isRunningGame ? presentation.label : 'Begegnung starten';
      button.title = isRunningGame ? presentation.title : 'Neue Begegnung starten';
    }

    function toggleDuelStats() {
      duelStatsEnabled = !duelStatsEnabled;
      localStorage.setItem('liveDuelStatsEnabled', String(duelStatsEnabled));
      updateDuelStatsToggle(liveState);
      if (!liveState) return;
      if (!duelStatsEnabled) {
        if (duelStatsTimer) { clearTimeout(duelStatsTimer); duelStatsTimer = null; }
        duelStatsScheduledFor = '';
        duelStatsVisibleFor = '';
        hideDuelStatsOverlay();
        if (liveState.game.status === 'leg-finished' && pendingWinner) showWinnerOverlay(pendingWinner, liveState);
      } else if (liveState.game.status === 'leg-finished') {
        showDuelStatsAfterWinner(liveState);
      }
    }

    function aggregateDuelStats(duel, selectedLegs) {
      const rows = new Map();
      (duel && duel.players || []).forEach(player => rows.set(Number(player.player_slot), {
        name: player.player_name || 'Spieler', wins: 0, legs: 0, darts: 0, scored: 0,
        checkoutAttempts: 0, checkoutSuccess: 0, highestCheckout: 0, bestLeg: null,
        count60plus: 0, count80plus: 0, count100plus: 0, count140plus: 0, count180: 0, firstNineTotal: 0, firstNineCount: 0
      }));
      (selectedLegs || duel && duel.legs || []).forEach(leg => (leg.players || []).forEach(player => {
        const row = rows.get(Number(player.player_slot));
        if (!row) return;
        row.legs += 1;
        row.wins += Number(player.won || 0);
        row.darts += Number(player.darts || 0);
        row.scored += Number(player.scored || 0);
        row.checkoutAttempts += Number(player.checkout_attempts || 0);
        row.checkoutSuccess += Number(player.checkout_success || 0);
        row.highestCheckout = Math.max(row.highestCheckout, Number(player.checkout_highest || 0));
        if (Number(player.first_nine_avg || 0) > 0) {
          row.firstNineTotal += Number(player.first_nine_avg);
          row.firstNineCount += 1;
        }
        row.bestLeg = row.bestLeg === null ? Number(player.won || 0) ? Number(player.darts || 0) : null : row.bestLeg;
        if (Number(player.won || 0) && Number(player.darts || 0) > 0) row.bestLeg = row.bestLeg === null ? Number(player.darts) : Math.min(row.bestLeg, Number(player.darts));
        row.count60plus += Number(player.count_60plus || 0);
        row.count80plus += Number(player.count_80plus || 0);
        row.count100plus += Number(player.count_100plus || 0);
        row.count140plus += Number(player.count_140plus || 0);
        row.count180 += Number(player.count_180 || 0);
      }));
      return Array.from(rows.values()).map(row => ({
        ...row,
        average: row.darts > 0 ? (row.scored / row.darts * 3).toFixed(2) : '-',
        checkoutRate: row.checkoutAttempts > 0 ? Math.round(row.checkoutSuccess / row.checkoutAttempts * 100) + '%' : '-',
        checkoutCount: row.checkoutSuccess + ' / ' + row.checkoutAttempts,
        firstNineAverage: row.firstNineCount > 0 ? (row.firstNineTotal / row.firstNineCount).toFixed(2) : '-',
        bestLeg: row.bestLeg || '-',
        scoring: row.darts > 0 ? (row.scored / row.darts * 3).toFixed(2) : '-'
      }));
    }

    function renderDuelStatsOverlay(duel, state) {
      const overlay = document.getElementById('duelStatsOverlay');
      if (!overlay) return;
      duelStatsRenderState = state;
      const legs = Array.isArray(duel && duel.legs) ? duel.legs.slice().sort((a, b) => Number(a.leg_number || 0) - Number(b.leg_number || 0)) : [];
      if (!legs.length) return;
      if (duelStatsLegIndex >= legs.length) duelStatsLegIndex = -1;
      const selectedLegs = duelStatsLegIndex >= 0 ? [legs[duelStatsLegIndex]] : legs;
      const stats = aggregateDuelStats(duel, selectedLegs);
      if (stats.length < 2) return;
      const winner = Array.isArray(state.players)
        ? state.players.find(player => Number(player.slot) === Number(state.lastAction && state.lastAction.winnerSlot))
        : null;
      const matchComplete = isMatchComplete(state, winner);
      const legsToWin = Math.max(1, Number(state.game && state.game.legsToWin || 1));
      const progressText = matchComplete
        ? 'Begegnung beendet · Sieger: ' + escapeHtml(winner ? winner.name : 'unbekannt')
        : 'Leg beendet · Stand ' + stats.map(item => item.wins).join(' : ') + ' · nächster Schritt: Nächstes Leg starten';
      const viewLabel = duelStatsLegIndex < 0 ? 'Alle Legs' : 'Leg ' + Number(legs[duelStatsLegIndex].leg_number || duelStatsLegIndex + 1);
      const legNavigation = '<div class="duel-leg-nav"><button type="button" onclick="changeDuelStatsLeg(-1)" ' + (duelStatsLegIndex < 0 ? 'disabled' : '') + '>‹ Zurück</button><strong>' + viewLabel + '</strong><button type="button" onclick="changeDuelStatsLeg(1)" ' + (duelStatsLegIndex >= legs.length - 1 ? 'disabled' : '') + '>Vor ›</button></div>';
      const labels = [
        [duelStatsLegIndex < 0 ? 'Legs gewonnen' : 'Leg gewonnen', stats[0].wins, stats[1].wins],
        ['Schnitt', stats[0].average, stats[1].average],
        ['Scoring', stats[0].scoring, stats[1].scoring],
        ['Erster-9-AVG', stats[0].firstNineAverage, stats[1].firstNineAverage],
        ['Checkout', stats[0].checkoutRate, stats[1].checkoutRate],
        ['Checkout-Rate', stats[0].checkoutCount, stats[1].checkoutCount],
        ['Höchstes Finish', stats[0].highestCheckout || '-', stats[1].highestCheckout || '-'],
        ['Würfe', stats[0].darts, stats[1].darts],
        ['Bestes Leg', stats[0].bestLeg, stats[1].bestLeg],
        ['60+', stats[0].count60plus, stats[1].count60plus],
        ['80+', stats[0].count80plus, stats[1].count80plus],
        ['100+', stats[0].count100plus, stats[1].count100plus],
        ['140+', stats[0].count140plus, stats[1].count140plus],
        ['180', stats[0].count180, stats[1].count180]
      ];
      const gridColumns = 'minmax(110px, 1fr) ' + stats.map(() => 'minmax(105px, 1fr)').join(' ');
      overlay.innerHTML = '<div class="duel-stats-card"><div class="duel-stats-title">Begegnung · ' + escapeHtml(duel.id) + '</div>' +
        '<div class="duel-stats-score">' + escapeHtml(state.game.mode || '501') + ' · ' + stats.map(item => item.wins).join(' : ') + '</div>' +
        '<div class="duel-stats-progress">Best of ' + (legsToWin * 2 - 1) + ' · ' + progressText + '</div>' +
        legNavigation +
        '<div class="duel-view-tabs"><button class="duel-view-tab active" data-duel-view="stats">Duellstatistik</button><button class="duel-view-tab" data-duel-view="heatmap">Heatmap</button></div>' +
        '<div class="duel-view-panel" data-duel-panel="stats"><div class="duel-stats-grid" style="grid-template-columns:' + gridColumns + '"><div class="duel-stats-cell label"> </div>' +
        stats.map((item, index) => '<div class="duel-stats-cell player' + (index ? ' second' : '') + '">' + escapeHtml(item.name) + '</div>').join('') +
        labels.map(row => '<div class="duel-stats-cell label">' + row[0] + '</div>' + stats.map((item, index) => '<div class="duel-stats-cell value">' + row[index + 1] + '</div>').join('')).join('') +
        '</div></div><div class="duel-view-panel" data-duel-panel="heatmap" hidden><div id="duelHeatmapContent"><div class="heatmap-empty">Heatmap wird geladen ...</div></div></div><div class="duel-stats-actions">' + (String(state.game && state.game.matchType) === 'tournament' ? '' : (!matchComplete ? '<button class="duel-stats-next" onclick="startNextLegCountdown()">Nächstes Leg starten</button>' : '')) + '<button class="duel-stats-close" onclick="' + (String(state.game && state.game.matchType) === 'tournament' ? 'closeTournamentDuelStats()' : 'closeDuelStats()') + '">' + (String(state.game && state.game.matchType) === 'tournament' ? 'Statistik schließen' : 'Statistik ausblenden') + '</button></div></div>';
      overlay.style.display = 'flex';
      overlay.querySelectorAll('[data-duel-view]').forEach(button => button.addEventListener('click', () => {
        const view = button.dataset.duelView;
        overlay.querySelectorAll('[data-duel-view]').forEach(item => item.classList.toggle('active', item === button));
        overlay.querySelectorAll('[data-duel-panel]').forEach(panel => { panel.hidden = panel.dataset.duelPanel !== view; });
        if (view === 'heatmap') loadDuelHeatmap(duel.id, state);
      }));
    }

    function changeDuelStatsLeg(direction) {
      if (!duelStatsCache || !Array.isArray(duelStatsCache.legs)) return;
      const count = duelStatsCache.legs.length;
      if (direction > 0) {
        duelStatsLegIndex = duelStatsLegIndex < 0 ? 0 : Math.min(count - 1, duelStatsLegIndex + 1);
      } else if (direction < 0) {
        duelStatsLegIndex = duelStatsLegIndex <= 0 ? -1 : duelStatsLegIndex - 1;
      }
      renderDuelStatsOverlay(duelStatsCache, duelStatsRenderState || liveState);
    }

    let heatmapMetric = localStorage.getItem('duelHeatmapMetric') || 'accuracy';
    const DARTBOARD_ORDER = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];

    function heatmapColor(value, max) {
      const ratio = max > 0 ? Math.max(0, Math.min(1, value / max)) : 0;
      const hue = 205 - ratio * 180;
      return 'hsl(' + hue.toFixed(0) + ' 78% ' + (24 + ratio * 35).toFixed(0) + '%)';
    }

    function ringPath(inner, outer, start, end, center = 180) {
      const point = (radius, angle) => {
        const radians = (angle - 90) * Math.PI / 180;
        return [center + radius * Math.cos(radians), center + radius * Math.sin(radians)];
      };
      const a = point(outer, start); const b = point(outer, end);
      const c = point(inner, end); const d = point(inner, start);
      const large = end - start > 180 ? 1 : 0;
      return 'M ' + a.join(' ') + ' A ' + outer + ' ' + outer + ' 0 ' + large + ' 1 ' + b.join(' ') + ' L ' + c.join(' ') + ' A ' + inner + ' ' + inner + ' 0 ' + large + ' 0 ' + d.join(' ') + ' Z';
    }

    function renderDartboard(player, metric) {
      const items = new Map((player.analysis && player.analysis.segments || []).map(item => [String(item.segment).toUpperCase(), item]));
      const values = Array.from(items.values()).map(item => metric === 'accuracy'
        ? (Number(item.throws) > 0 ? Number(item.hits) / Number(item.throws) : 0)
        : Number(item.throws || 0));
      const max = Math.max(1, ...values);
      const zone = (segment, inner, outer, start, end) => {
        const item = items.get(segment) || { throws: 0, hits: 0, points: 0, average: 0, busts: 0 };
        const value = metric === 'accuracy' ? (item.throws ? item.hits / item.throws : 0) : Number(item.throws || 0);
        return '<path class="dartboard-zone" data-segment="' + segment + '" d="' + ringPath(inner, outer, start, end) + '" fill="' + heatmapColor(value, max) + '" />';
      };
      let svg = '<svg class="dartboard-svg" viewBox="0 0 360 360" role="img" aria-label="Dartboard-Heatmap für ' + escapeAttr(player.name) + '">';
      DARTBOARD_ORDER.forEach((number, index) => {
        const start = index * 18 - 8.3; const end = (index + 1) * 18 - 9.7;
        svg += zone('S' + number, 32, 142, start, end);
        svg += zone('T' + number, 78, 92, start, end);
        svg += zone('D' + number, 142, 156, start, end);
        const angle = (start + end) / 2; const radians = (angle - 90) * Math.PI / 180;
        svg += '<text class="dartboard-number" x="' + (180 + 169 * Math.cos(radians)).toFixed(1) + '" y="' + (180 + 169 * Math.sin(radians)).toFixed(1) + '">' + number + '</text>';
      });
      const bull = items.get('SBULL') || { throws: 0, hits: 0, points: 0, average: 0, busts: 0 };
      const dbull = items.get('DBULL') || { throws: 0, hits: 0, points: 0, average: 0, busts: 0 };
      const bullValue = item => metric === 'accuracy' ? (item.throws ? item.hits / item.throws : 0) : Number(item.throws || 0);
      svg += '<circle class="dartboard-zone" data-segment="SBULL" cx="180" cy="180" r="30" fill="' + heatmapColor(bullValue(bull), max) + '" /><circle class="dartboard-zone" data-segment="DBULL" cx="180" cy="180" r="14" fill="' + heatmapColor(bullValue(dbull), max) + '" /><circle cx="180" cy="180" r="156" fill="none" stroke="#d7e0e5" stroke-width="1.5" /></svg>';
      return svg;
    }

    function loadDuelHeatmap(duelId, state) {
      const content = document.getElementById('duelHeatmapContent');
      if (!content) return;
      fetch('/api/duels/' + encodeURIComponent(duelId) + '/segment-analysis?mode=' + encodeURIComponent(state.game.mode || '501'), { cache: 'no-store' })
        .then(response => { if (!response.ok) throw new Error('Heatmap konnte nicht geladen werden'); return response.json(); })
        .then(data => {
          const players = Array.isArray(data.players) ? data.players : [];
          if (!players.length) { content.innerHTML = '<div class="heatmap-empty">Für diese Begegnung sind noch keine Wurfsegmente gespeichert.</div>'; return; }
          content.innerHTML = '<div class="heatmap-toolbar"><div class="heatmap-metrics"><button class="heatmap-metric ' + (heatmapMetric === 'accuracy' ? 'active' : '') + '" data-metric="accuracy">Trefferquote</button><button class="heatmap-metric ' + (heatmapMetric === 'frequency' ? 'active' : '') + '" data-metric="frequency">Wurfhäufigkeit</button></div><div class="heatmap-legend"><span>niedrig</span><span class="heatmap-legend-bar"></span><span>hoch</span></div></div><div class="heatmap-boards">' + players.map((player, index) => '<div class="heatmap-player' + (index ? ' second' : '') + '"><div class="heatmap-player-name">' + escapeHtml(player.name) + '</div><div class="heatmap-board-wrap">' + renderDartboard(player, heatmapMetric) + '</div><div class="heatmap-detail" data-detail-for="' + player.slot + '">Segment auswählen</div></div>').join('') + '</div>';
          content.querySelectorAll('[data-metric]').forEach(button => button.addEventListener('click', () => { heatmapMetric = button.dataset.metric; localStorage.setItem('duelHeatmapMetric', heatmapMetric); loadDuelHeatmap(duelId, state); }));
          content.querySelectorAll('.heatmap-player').forEach((board, index) => board.querySelectorAll('[data-segment]').forEach(zoneElement => zoneElement.addEventListener('click', () => {
            board.querySelectorAll('.selected').forEach(item => item.classList.remove('selected')); zoneElement.classList.add('selected');
            const player = players[index]; const item = (player.analysis.segments || []).find(segment => String(segment.segment).toUpperCase() === zoneElement.dataset.segment) || { throws: 0, hits: 0, points: 0, average: 0 };
            const quote = item.throws ? (item.hits / item.throws * 100).toFixed(1) : '0.0';
            board.querySelector('.heatmap-detail').textContent = zoneElement.dataset.segment + ': ' + item.throws + ' Würfe · ' + quote + '% Treffer · ' + item.points + ' Punkte';
          })));
        }).catch(() => { content.innerHTML = '<div class="heatmap-empty">Heatmap-Daten konnten nicht geladen werden.</div>'; });
    }

    async function showDuelStatsAfterWinner(state) {
      const key = getDuelStatsKey(state);
      if (!key || !duelStatsEnabled || duelStatsScheduledFor === key || duelStatsVisibleFor === key) return;
      const duelId = Number(state.game.duelId);
      if (!duelId) return;
      duelStatsScheduledFor = key;
      duelStatsTimer = setTimeout(async () => {
        duelStatsTimer = null;
        if (!liveState || liveState.game.status !== 'leg-finished' || getDuelStatsKey(liveState) !== key || !duelStatsEnabled) return;
        try {
          const response = await fetch('/api/duels/' + encodeURIComponent(duelId), { cache: 'no-store' });
          if (!response.ok) throw new Error('Duell konnte nicht geladen werden');
          const duel = await response.json();
          if (!duel || !Array.isArray(duel.players) || duel.players.length < 2 || !Array.isArray(duel.legs) || duel.legs.length < 1) {
            duelStatsScheduledFor = '';
            return;
          }
          duelStatsLegIndex = -1;
          duelStatsCache = duel;
          duelStatsCacheKey = key;
          renderDuelStatsOverlay(duelStatsCache, liveState);
          duelStatsVisibleFor = key;
          hideWinnerOverlay();
        } catch {
          duelStatsScheduledFor = '';
        }
      }, 5000);
    }

    async function showTournamentDuelStatsAfterAdvance(state) {
      const action = state && state.lastAction;
      const duelId = Number(action && action.completedDuelId || 0);
      const isTournamentMatchFinished = action && ['tournament-advance', 'tournament-match-finished'].includes(action.type);
      const key = isTournamentMatchFinished ? 'tournament:' + Number(action.tournamentId || 0) + ':' + duelId + ':' + String(action.ts || '') : '';
      if (!key || !duelId || duelStatsVisibleFor === key || duelStatsScheduledFor === key) return;
      duelStatsScheduledFor = key;
      duelStatsTimer = setTimeout(async () => {
        duelStatsTimer = null;
        try {
          const response = await fetch('/api/duels/' + encodeURIComponent(duelId), { cache: 'no-store' });
          if (!response.ok) throw new Error('Turnierduell konnte nicht geladen werden');
          const duel = await response.json();
          if (!duel || !Array.isArray(duel.players) || duel.players.length < 2 || !Array.isArray(duel.legs) || duel.legs.length < 1) return;
          const previousPlayers = duel.players.map(player => ({
            slot: Number(player.player_slot),
            name: player.player_name,
            legs: duel.legs.filter(leg => (leg.players || []).some(item => Number(item.player_slot) === Number(player.player_slot) && Number(item.won || 0))).length
          }));
          const statsState = {
            ...state,
            players: previousPlayers,
            game: { ...state.game, duelId, status: 'leg-finished' },
            lastAction: { ...state.lastAction, winnerSlot: Number(duel.winner_slot || 0) || null }
          };
          duelStatsLegIndex = -1;
          duelStatsCache = duel;
          duelStatsCacheKey = key;
          renderDuelStatsOverlay(duel, statsState);
          duelStatsVisibleFor = key;
          hideWinnerOverlay();
        } catch (_error) {
          duelStatsScheduledFor = '';
        }
      }, 0);
    }

    function hideDuelStatsOverlay() {
      const overlay = document.getElementById('duelStatsOverlay');
      if (overlay) overlay.style.display = 'none';
    }

    async function closeDuelStats() {
      if (!liveState || !liveState.game || !Number(liveState.game.duelId)) {
        hideDuelStatsOverlay();
        return;
      }
      const button = document.querySelector('.duel-stats-close');
      if (button) button.disabled = true;
      try {
        const response = await fetch('/api/duels/' + encodeURIComponent(liveState.game.duelId) + '/presentation/stats-hidden', { method: 'POST' });
        const state = await response.json();
        if (!response.ok) throw new Error(state.error || 'HTTP ' + response.status);
        liveState = state;
        duelStatsScheduledFor = '';
        duelStatsVisibleFor = getDuelStatsKey(state);
        hideDuelStatsOverlay();
        renderState(state);
      } catch (error) {
        if (button) button.disabled = false;
        showToast('Statistik konnte nicht ausgeblendet werden: ' + error.message, true);
      }
    }

    async function closeTournamentDuelStats() {
      if (!liveState || String(liveState.game && liveState.game.matchType) !== 'tournament') return;
      const tournamentId = Number(liveState.game.tournamentId || 0);
      if (!tournamentId) return;
      const button = document.querySelector('.duel-stats-close');
      if (button) button.disabled = true;
      try {
        const response = await fetch('/api/tournaments/' + encodeURIComponent(tournamentId) + '/presentation/bracket', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
        const state = await response.json();
        if (!response.ok) throw new Error(state.error || 'HTTP ' + response.status);
        liveState = state;
        duelStatsScheduledFor = '';
        duelStatsVisibleFor = '';
        hideDuelStatsOverlay();
        hideWinnerOverlay();
        tournamentBracketKey = '';
        tournamentBracketRequest = null;
        renderState(state);
        renderTournamentBracket(state, true);
      } catch (error) {
        if (button) button.disabled = false;
        showToast('Turnierbaum konnte nicht angezeigt werden: ' + error.message, true);
      }
    }

    function getGameModeLabel(mode) {
      return mode === '501' ? '501' : mode === '301' ? '301' : mode === '701' ? '701' : mode === 'cricket' ? 'Cricket' : mode === 'elimination' ? '301-Elimination' : mode === 'shanghai' ? 'Shanghai' : mode === 'atc' ? 'ATC' : mode === 'split' ? 'Split' : mode || '501';
    }

    function getCheckoutRuleLabel(rule) {
      return ({ single: 'Single-Out', double: 'Double-Out', master: 'Master-Out' })[String(rule || 'double')] || 'Double-Out';
    }

    function getTournamentMatchMarkup(state) {
      const game = state && state.game ? state.game : {};
      if (String(game.matchType) !== 'tournament' || !Array.isArray(state.players)) return '';
      const previousWinnerSlot = Number(state.lastAction && state.lastAction.previousWinnerSlot || 0);
      const previousLoserSlot = Number(state.lastAction && state.lastAction.previousLoserSlot || 0);
      const roundLabel = game.tournamentMatchLabel || 'Turnierduell';
      const players = state.players.slice(0, 2).map(player => {
        const slot = Number(player.slot);
        const resultClass = slot === previousWinnerSlot ? ' winner' : slot === previousLoserSlot ? ' loser' : '';
        const resultLabel = slot === previousWinnerSlot ? ' · Sieger' : slot === previousLoserSlot ? ' · Verlierer' : '';
        return '<div class="tournament-match-player' + resultClass + '" style="--player-color:' + escapeAttr(player.color || '#f4a261') + '"><span>' + escapeHtml(player.name) + '</span><strong>' + Number(player.legs || 0) + '</strong><span>' + resultLabel + '</span></div>';
      }).join('');
      return '<div class="tournament-match-card"><strong>' + escapeHtml(game.tournamentName || 'K.-o.-Turnier') + '</strong><div>' + escapeHtml(roundLabel) + ' · Duell ' + Number(game.tournamentMatchId || 0) + ' · BO' + Number(game.bestOf || 1) + '</div><div class="tournament-match-players">' + players + '</div></div>';
    }

    function showTournamentMatchIntro(state) {
      if (!state || String(state.game && state.game.matchType) !== 'tournament') return;
      const key = String(state.game.tournamentMatchId || state.game.duelId || '') + ':' + String(state.game.tournamentRound || '');
      if (!key || tournamentIntroKey === key) return;
      tournamentIntroKey = key;
      const overlay = document.getElementById('legStartOverlay');
      if (!overlay) return;
      let remaining = 5;
      overlay.innerHTML = '<div class="leg-start-card"><h2 id="legStartTitle">Turnierduell startet</h2><div>' + escapeHtml(getGameModeLabel(state.game.mode)) + ' · Leg 1</div>' + getTournamentMatchMarkup(state) + '<div class="leg-start-count" id="legStartCount">' + remaining + '</div><div>Bitte bereit machen</div></div>';
      overlay.classList.add('show');
      const timer = setInterval(() => {
        remaining -= 1;
        const count = document.getElementById('legStartCount');
        if (count) count.textContent = String(Math.max(0, remaining));
        if (remaining <= 0) { clearInterval(timer); overlay.classList.remove('show'); }
      }, 1000);
    }

    function closeTournamentBracket() {
      const overlay = document.getElementById('tournamentBracketOverlay');
      if (overlay) overlay.classList.remove('show');
    }

    async function startNextTournamentMatch() {
      if (!liveState || String(liveState.game && liveState.game.matchType) !== 'tournament') return;
      const tournamentId = Number(liveState.game.tournamentId || 0);
      const matchId = Number(liveState.game.tournamentMatchId || 0);
      if (!tournamentId || !matchId) return;
      const button = document.querySelector('.tournament-next-button');
      if (button) button.disabled = true;
      try {
        const response = await fetch('/api/tournaments/' + encodeURIComponent(tournamentId) + '/matches/' + encodeURIComponent(matchId) + '/start', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
        const state = await response.json();
        if (!response.ok) throw new Error(state.error || 'HTTP ' + response.status);
        liveState = state;
        renderState(state);
      } catch (error) {
        if (button) button.disabled = false;
        showToast('Turnierduell konnte nicht gestartet werden: ' + error.message, true);

    function tournamentRoundTitle(round, maxRound) {
      const titles = { 1: 'Achtelfinale', 2: 'Viertelfinale', 3: 'Halbfinale', 4: 'Finale' };
      return titles[maxRound - round + 1] || ('Runde ' + round);
    }

    function tournamentNodePlayer(name, slot, match, winnerSlot, loserSlot) {
      const hasPlayer = Number(slot || 0) > 0 && String(name || '').trim();
      const resultClass = Number(slot) === Number(winnerSlot) ? ' winner' : Number(slot) === Number(loserSlot) ? ' loser' : '';
      return '<div class="tournament-node-player' + (hasPlayer ? resultClass : ' empty') + '"><span>' + escapeHtml(hasPlayer ? name : 'wartet auf Sieger') + '</span><strong>' + (hasPlayer && Number(match.round) === 1 ? 'P' + Number(slot) : '') + '</strong></div>';
    }

    async function renderTournamentBracket(state, forceOpen = false) {
      const inlineContainer = document.getElementById('tournamentBracket');
      const overlay = document.getElementById('tournamentBracketOverlay');
      const container = document.getElementById('tournamentBracketOverlayContent');
      const tournamentId = Number(state && state.game && state.game.tournamentId || 0);
      if (!container || !inlineContainer) return;
      if (!tournamentId || String(state.game.matchType) !== 'tournament') {
        inlineContainer.classList.remove('show');
        if (overlay) overlay.classList.remove('show');
        tournamentBracketKey = '';
        return;
      }
      const isTournamentFinished = state.lastAction && state.lastAction.type === 'tournament-finished';
      if (!forceOpen && !isTournamentFinished && Number(state.game.tournamentMatchStartedAt || 0) > 0) {
        if (overlay) overlay.classList.remove('show');
        return;
      }
      if (!forceOpen && !isTournamentFinished && state.lastAction && state.lastAction.type === 'tournament-advance') {
        if (overlay) overlay.classList.remove('show');
        return;
      }
      const key = String(tournamentId) + ':' + String(state.game.tournamentMatchId || '') + ':' + String(state.lastAction && state.lastAction.ts || '');
      inlineContainer.classList.remove('show');
      if (overlay) overlay.classList.add('show');
      if (tournamentBracketKey === key || tournamentBracketRequest) return;
      tournamentBracketKey = key;
      tournamentBracketRequest = fetch('/api/tournaments/' + encodeURIComponent(tournamentId), { cache: 'no-store' })
        .then(response => { if (!response.ok) throw new Error('Turnier konnte nicht geladen werden'); return response.json(); })
        .then(tournament => {
          const matches = Array.isArray(tournament.matches) ? tournament.matches : [];
          const maxRound = Math.max(1, ...matches.map(match => Number(match.round || 1)));
          const rounds = [];
          for (let round = 1; round <= maxRound; round += 1) rounds.push(matches.filter(match => Number(match.round) === round));
          const activeId = Number(state.game.tournamentMatchId || 0);
          const winnerSlot = Number(state.lastAction && state.lastAction.tournamentWinnerSlot || 0);
          const winner = (state.players || []).find(player => Number(player.slot) === winnerSlot);
          const winnerHeader = isTournamentFinished ? '<div class="tournament-winner-banner"><span class="tournament-winner-icon">🏆</span><div><strong>Turnier beendet</strong><span>Sieger: ' + escapeHtml(winner ? winner.name : 'Unbekannt') + '</span></div></div>' : '';
          const actionButtons = isTournamentFinished ? '<button class="tournament-bracket-close" type="button" onclick="closeTournamentBracket()">Schließen</button>' : '<button class="tournament-bracket-close" type="button" onclick="closeTournamentBracket()">Schließen</button><button class="tournament-next-button" type="button" onclick="startNextTournamentMatch()">Nächstes Duell starten</button>';
          container.innerHTML = winnerHeader + '<div class="tournament-bracket-head"><span class="tournament-bracket-title" id="tournamentBracketTitle">' + escapeHtml(tournament.name || 'K.-o.-Turnier') + '</span><div>' + actionButtons + '</div></div><div class="tournament-bracket-grid">' + rounds.map((roundMatches, index) => '<div class="tournament-round"><div class="tournament-round-title">' + tournamentRoundTitle(index + 1, maxRound) + '</div>' + roundMatches.map(match => {
            const status = String(match.status || 'waiting');
            const nodeClass = status + (Number(match.id) === activeId ? ' active' : '');
            return '<div class="tournament-node ' + nodeClass + '"><div class="tournament-node-label">' + escapeHtml(match.label || 'Duell') + (status === 'active' ? ' · läuft' : status === 'finished' ? ' · beendet' : ' · wartet') + '</div>' + tournamentNodePlayer(match.player_one_name, match.player_one_slot, match, match.winner_slot, match.loser_slot) + tournamentNodePlayer(match.player_two_name, match.player_two_slot, match, match.winner_slot, match.loser_slot) + '</div>';
          }).join('') + '</div>').join('') + '</div>';
          const button = container.querySelector('.tournament-next-button');
          if (button) button.disabled = !matches.some(match => Number(match.id) === activeId && String(match.status) === 'active');
        })
        .catch(error => { container.innerHTML = '<div class="tournament-node-label">' + escapeHtml(error.message) + '</div>'; })
        .finally(() => { tournamentBracketRequest = null; });
    }

    function getFocusModeLabel(state) {
      const baseLabel = getGameModeLabel(state && state.game && state.game.mode);
      const game = state && state.game ? state.game : {};
      const typeLabels = { direct: 'Duell', group: 'Mehrspieler', tournament: 'Turnier' };
      const typeLabel = typeLabels[String(game.matchType || '')];
      if (!typeLabel) return baseLabel;
      const bestOf = Number(game.bestOf || 1);
      const checkoutLabels = { single: 'Single-Out', double: 'Double-Out', master: 'Master-Out' };
      const details = [typeLabel, bestOf > 1 ? 'BO' + bestOf : 'Einzelleg'];
      details.push(checkoutLabels[String(game.checkoutRule || 'double')] || 'Double-Out');
      if (typeLabel === 'Turnier' && String(game.tournamentName || '').trim()) details.push(String(game.tournamentName).trim());
      return baseLabel + ' · ' + details.join(' · ');
    }

    function getFocusCheckoutLabel(state) {
      const rule = String(state && state.game && state.game.checkoutRule || 'double');
      return ({ single: 'Single-Out', double: 'Double-Out', master: 'Master-Out' })[rule] || 'Double-Out';
    }

    function renderFocusPlayer(p, idx, state) {
      if (!p) return '';

      const displayThrows = [...currentRound];
      while (displayThrows.length < 3) displayThrows.push(null);
      const totalScored = p.totalScored || 0;
      const legStats = getLiveLegStats(p);

      const checkoutLabel = getFocusCheckoutLabel(state);
      
      const throwsHtml = displayThrows.map((pt, ti) => {

        '<div class="focus-player-line"><span class="focus-player-name">🎯 ' + escapeHtml(p.name) + '</span><span class="focus-switch-timer"></span></div>' +
        '<div class="focus-kacheln">' +
