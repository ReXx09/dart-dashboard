<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spieler-Verwaltung – HB8</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0a; color: #f1f1f1; font-family: "Segoe UI", system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }

    /* TOPBAR */
    .topbar { background: #111; border-bottom: 3px solid #e63946; padding: 10px 28px; display: flex; align-items: center; gap: 12px; }
    .topbar a { color: #666; text-decoration: none; font-size: 0.82rem; transition: color .2s; }
    .topbar a:hover { color: #f1f1f1; }
    .topbar .sep { color: #333; }
    .topbar h1 { font-size: 1.1rem; font-weight: 700; flex: 1; }
    .topbar .status-badge { font-size: 0.78rem; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 20px; padding: 4px 12px; color: #888; }
    .topbar .status-badge span { color: #e63946; font-weight: 700; }

    /* MAIN */
    main { flex: 1; padding: 14px 28px 16px; max-width: 1100px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 14px; }

    /* HEADER ROW */
    .page-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .page-header-left h2 { font-size: 1rem; font-weight: 700; }
    .page-header-left p { font-size: 0.78rem; color: #555; margin-top: 3px; }
    .btn-save { background: #e63946; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.88rem; font-weight: 700; cursor: pointer; transition: background .2s; }
    .btn-save:hover { background: #c1121f; }
    .btn-save:disabled { background: #333; color: #555; cursor: default; }

    /* SLOTS GRID */
    .slots-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }

    /* SLOT CARD */
    .slot-card { background: #161616; border-radius: 10px; border: 2px solid #1e1e1e; padding: 10px 14px; display: flex; flex-direction: column; gap: 7px; transition: border-color .2s; }
    .slot-card.active { border-color: var(--sc, #e63946); }
    .slot-card.active .slot-num { background: var(--sc, #e63946); color: #fff; }

    .slot-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .slot-num { width: 26px; height: 26px; border-radius: 50%; background: #222; color: #555; font-size: 0.75rem; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background .2s, color .2s; }
    .slot-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: #444; flex: 1; }

    /* Toggle */
    .toggle { position: relative; width: 38px; height: 22px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
    .toggle-track { position: absolute; inset: 0; background: #222; border-radius: 11px; cursor: pointer; transition: background .2s; border: 1px solid #2e2e2e; }
    .toggle-track::after { content: ''; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: #444; transition: transform .2s, background .2s; }
    .toggle input:checked + .toggle-track { background: #e6394633; border-color: #e63946; }
    .toggle input:checked + .toggle-track::after { transform: translateX(16px); background: #e63946; }

    /* Name input */
    .slot-name-input { background: #111; border: 1px solid #2a2a2a; border-radius: 7px; color: #f1f1f1; font-size: 0.9rem; padding: 6px 10px; width: 100%; outline: none; transition: border-color .2s; }
    .slot-name-input:focus { border-color: #e63946; }
    .slot-name-input::placeholder { color: #333; }

    /* Color row */
    .slot-colors { display: flex; gap: 6px; align-items: center; }
    .slot-colors span { font-size: 0.65rem; color: #444; text-transform: uppercase; letter-spacing: 1px; }
    .color-dot { width: 18px; height: 18px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform .15s, border-color .15s; flex-shrink: 0; }
    .color-dot:hover { transform: scale(1.2); }
    .color-dot.selected { border-color: #fff; transform: scale(1.15); }
    .custom-color { width: 24px; height: 22px; padding: 1px; border: 1px solid #444; border-radius: 6px; background: #111; cursor: pointer; }
    .custom-color:focus { outline: 2px solid #fff; outline-offset: 1px; }

    /* Info row */
    .slot-info { font-size: 0.72rem; color: #333; min-height: 16px; }
    .slot-card.active .slot-info { color: #555; }

    /* ACTIVE PLAYERS SUMMARY */
    .summary-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .player-chip { display: flex; align-items: center; gap: 6px; background: #161616; border: 1px solid #2a2a2a; border-radius: 20px; padding: 5px 12px 5px 8px; font-size: 0.8rem; }
    .player-chip .chip-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .player-chip .chip-slot { font-size: 0.65rem; color: #555; }
    .empty-hint { font-size: 0.8rem; color: #333; font-style: italic; }

    /* Toast */
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(60px); background: #1e1e1e; border: 1px solid #333; color: #f1f1f1; padding: 10px 24px; border-radius: 8px; font-size: 0.88rem; opacity: 0; transition: all .3s; z-index: 999; white-space: nowrap; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    body.tv-mode .topbar a,
    body.tv-mode .status-badge,
    body.tv-mode #saveBtn,
    body.tv-mode footer {
      display: none !important;
    }
    body.tv-mode main { max-width: none; padding: 14px 18px 16px; }
    body.tv-mode .page-header { justify-content: flex-start; }
    body.tv-mode .page-header-left p,
    body.tv-mode .slot-colors,
    body.tv-mode .toggle,
    body.tv-mode .slot-info,
    body.tv-mode #clock-mini,
    body.tv-mode .section-header {
      display: none !important;
    }
    body.tv-mode .summary-row { gap: 8px; }
    body.tv-mode .player-chip {
      background: #111;
      border-color: #252525;
      font-size: .88rem;
      padding: 6px 12px 6px 9px;
    }
    body.tv-mode .slots-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    body.tv-mode .slot-card { padding: 10px 12px; min-height: 82px; justify-content: center; }
    body.tv-mode .slot-card:not(.active) { display: none; }
    body.tv-mode .slot-head { margin-bottom: 6px; }
    body.tv-mode .slot-label { font-size: .62rem; }
    body.tv-mode .slot-name-input {
      font-size: 1rem;
      padding: 0;
      border: 0;
      background: transparent;
      font-weight: 700;
      pointer-events: none;
    }
    body.tv-mode .slot-name-input::placeholder { color: #555; }

    @media (max-width: 1000px) {
      body.tv-mode .slots-grid { grid-template-columns: 1fr; }
    }

    /* Section header */
    .section-header { display: flex; align-items: center; gap: 12px; }
    .section-header h2 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: #555; font-weight: 600; white-space: nowrap; }
    .section-header .line { flex: 1; height: 1px; background: #1e1e1e; }

    /* Profile Manager */
    .profile-manager { background: #141414; border-radius: 12px; border: 1px solid #1e1e1e; padding: 14px; }
    .profile-manager h3 { font-size: .78rem; color: #888; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; }
    .profile-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .profile-chip { display: flex; align-items: center; gap: 8px; background: #0d0d0d; border: 1px solid #2a2a2a; border-radius: 10px; padding: 6px 10px 6px 8px; font-size: .82rem; }
    .profile-chip .p-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .profile-chip .p-name { min-width: 110px; }
    .profile-color-options { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
    .profile-color-dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; transition: transform .15s, border-color .15s; }
    .profile-color-dot:hover { transform: scale(1.18); }
    .profile-color-dot.selected { border-color: #fff; transform: scale(1.12); }
    .profile-custom-color { width: 24px; height: 22px; padding: 1px; border: 1px solid #444; border-radius: 6px; background: #111; cursor: pointer; }
    .profile-custom-color:focus { outline: 2px solid #fff; outline-offset: 1px; }
    .profile-gradient { display: flex; align-items: center; gap: 4px; margin-left: auto; }
    .profile-gradient input { width: 22px; height: 20px; padding: 1px; border: 1px solid #444; border-radius: 5px; background: #111; cursor: pointer; }
    .profile-chip .p-del { cursor: pointer; color: #555; font-size: .7rem; margin-left: 4px; }
    .profile-chip .p-del:hover { color: #e63946; }
    .profile-add-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .profile-add-row input { background: #0d0d0d; border: 1px solid #2a2a2a; color: #f1f1f1; padding: 6px 10px; border-radius: 7px; font-size: .85rem; font-family: inherit; }
    .profile-add-row input:focus { border-color: #457b9d; outline: none; }
    .profile-add-row .btn-sm { background: #1e1e1e; border: 1px solid #2a2a2a; color: #ddd; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: .78rem; font-family: inherit; }
    .profile-add-row .btn-sm:hover { background: #2a2a2a; }

    .slot-name-row { display: flex; gap: 6px; align-items: center; }
    .slot-name-row select { background: #0d0d0d; border: 1px solid #2a2a2a; color: #f1f1f1; padding: 5px 8px; border-radius: 6px; font-size: .82rem; font-family: inherit; flex: 1; cursor: pointer; }
    .slot-name-row select:focus { border-color: #e63946; outline: none; }

    footer { text-align: center; padding: 8px; font-size: .65rem; color: #222; border-top: 1px solid #111; }
  </style>
</head>
<body>

  <script>
    if (new URLSearchParams(location.search).get('tv') === 'compact') {
      document.body.classList.add('tv-mode');
    }
  </script>

  <div class="topbar">
    <a href="/">← Zurück</a>
    <span class="sep">›</span>
    <h1>👤 Spieler-Verwaltung</h1>
    <div class="status-badge">HB8 — max. <span>8</span> Spieler</div>
    <span id="clock-mini" style="font-size:0.85rem;color:#e63946;font-variant-numeric:tabular-nums;letter-spacing:1px;margin-left:8px">--:--:--</span>
  </div>

  <main>

    <div class="page-header">
      <div class="page-header-left">
        <h2>Spieler-Slots – HB8</h2>
        <p>Gib jedem Slot einen Namen und aktiviere ihn, damit Scores korrekt zugeordnet werden.</p>
      </div>
      <button class="btn-save" id="saveBtn" onclick="saveAll()">💾 Speichern</button>
    </div>

    <!-- PROFILE MANAGER -->
    <div class="profile-manager">
      <h3>Stammspieler-Profile</h3>
      <div class="profile-list" id="profileList"></div>
      <div class="profile-add-row">
        <input type="text" id="profileNameInput" placeholder="Neuer Spielername..." maxlength="24" />
        <button class="btn-sm" onclick="addProfile()">+ Hinzufügen</button>
        <button class="btn-sm primary" id="saveProfilesBtn" onclick="saveProfiles()">Profile speichern</button>
      </div>
    </div>

    <!-- ACTIVE SUMMARY -->
    <div>
      <div class="section-header" style="margin-bottom:10px">
        <h2>Aktive Spieler</h2>
        <div class="line"></div>
      </div>
      <div class="summary-row" id="summaryRow">
        <span class="empty-hint">Noch keine aktiven Spieler</span>
      </div>
    </div>

    <!-- SLOTS -->
    <div class="slots-grid" id="slotsGrid"></div>

  </main>

  <footer>Löwen Dart Club – HB8 Spieler-Verwaltung</footer>
  <div class="toast" id="toast"></div>

  <script>
    const COLORS = [
      '#e63946','#f4a261','#2a9d8f','#457b9d',
      '#9b5de5','#2ec4b6','#f0b429','#52b788',
      '#ff6b6b','#ff9f1c','#06d6a0','#118ab2',
      '#c77dff','#00b4d8','#ffd166','#80ed99'
    ];

    let players = [];
    let profiles = [];
    let dirty = false;
    let profilesDirty = false;

    updateClock();
    setInterval(updateClock, 1000);
    function updateClock() {
      document.getElementById('clock-mini').textContent =
        new Date().toLocaleTimeString('de-DE');
    }

    async function load() {
      const [p, pr] = await Promise.all([
        fetch('/api/players').then(r => r.json()),
        fetch('/api/profiles').then(r => r.json()).catch(() => [])
      ]);
      players = p;
      profiles = Array.isArray(pr) ? pr : [];
      renderSlots();
      renderSummary();
      renderProfiles();
    }

    function renderSlots() {
      const grid = document.getElementById('slotsGrid');
      grid.innerHTML = '';
      players.forEach((p, idx) => {
        const color = p.color || COLORS[idx];
        const card = document.createElement('div');
        card.className = 'slot-card' + (p.active ? ' active' : '');
        card.style.setProperty('--sc', color);
        card.dataset.slot = p.slot;

        const colorDots = COLORS.map((c, ci) =>
          `<span class="color-dot${c === color ? ' selected' : ''}" style="background:${c}" data-ci="${ci}" title="${c}" onclick="pickColor(${idx},${ci},event)"></span>`
        ).join('');

        const profileOpts = profiles.map(pr =>
          `<option value="${pr.id}"${Number(pr.id) === Number(p.profileId) ? ' selected' : ''}>${escHtml(pr.name)}</option>`
        ).join('');

        card.innerHTML = `
          <div class="slot-head">
            <div class="slot-num">${p.slot}</div>
            <div class="slot-label">Spieler ${p.slot}</div>
            <label class="toggle" title="Aktiv/Inaktiv">
              <input type="checkbox" ${p.active ? 'checked' : ''} onchange="toggleActive(${idx},this)">
              <div class="toggle-track"></div>
            </label>
          </div>
          <div class="slot-name-row">
            <select onchange="applyProfile(${idx},this)" ${profiles.length ? '' : 'style="display:none"'}>
              <option value="">— Manuell —</option>
              ${profileOpts}
            </select>
            <input class="slot-name-input" type="text"
              placeholder="Name eingeben…"
              value="${escHtml(p.name || '')}"
              maxlength="24"
              oninput="setName(${idx},this.value)" />
          </div>
          <div class="slot-colors">
            <span>Farbe</span>
            ${colorDots}
            <input class="custom-color" type="color" value="${escAttr(normalizeColor(color, '#e63946'))}" aria-label="Eigene Farbe für Spieler ${p.slot}" title="Eigene Farbe" onchange="pickCustomColor(${idx},this.value,event)" />
          </div>
          <div class="slot-info" id="info-${idx}">${p.name ? `Slot ${p.slot}: ${escHtml(p.name)}` : 'Kein Name'}</div>
        `;
        grid.appendChild(card);
      });
    }

    function renderSummary() {
      const row = document.getElementById('summaryRow');
      const active = players.filter(p => p.active && p.name);
      if (!active.length) {
        row.innerHTML = '<span class="empty-hint">Noch keine aktiven Spieler</span>';
        return;
      }
      row.innerHTML = active.map((p, i) => {
        const color = p.color || COLORS[players.indexOf(p)];
        return `<div class="player-chip">
          <span class="chip-dot" style="background:${color}"></span>
          <span class="chip-slot">S${p.slot}</span>
          <span>${escHtml(p.name)}</span>
        </div>`;
      }).join('');
    }

    function setName(idx, val) {
      players[idx].name = val;
      players[idx].profileId = null;
      const info = document.getElementById(`info-${idx}`);
      if (info) info.textContent = val ? `Slot ${players[idx].slot}: ${val}` : 'Kein Name';
      renderSummary();
      markDirty();
    }

    function toggleActive(idx, el) {
      players[idx].active = el.checked;
      const card = el.closest('.slot-card');
      card.classList.toggle('active', el.checked);
      renderSummary();
      markDirty();
    }

    function pickColor(playerIdx, colorIdx, e) {
      // Update all dots in this card
      const card = e.target.closest('.slot-card');
      card.querySelectorAll('.color-dot').forEach((d, i) =>
        d.classList.toggle('selected', i === colorIdx)
      );
      const color = COLORS[colorIdx];
      card.style.setProperty('--sc', color);
      if (players[playerIdx].active) {
        card.querySelector('.slot-num').style.background = color;
      }
      players[playerIdx].color = color;
      markDirty();
    }

    function pickCustomColor(playerIdx, color, e) {
      const normalized = normalizeColor(color, '#e63946');
      const card = e.target.closest('.slot-card');
      card.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('selected'));
      card.style.setProperty('--sc', normalized);
      if (players[playerIdx].active) card.querySelector('.slot-num').style.background = normalized;
      players[playerIdx].color = normalized;
      markDirty();
    }

    function markDirty() {
      dirty = true;
      document.getElementById('saveBtn').disabled = false;
    }

    async function saveAll() {
      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.textContent = '…';
      try {
        const response = await fetch('/api/players', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(players)
        });
        if (!response.ok) {
          const result = await response.json().catch(() => ({}));
          throw new Error(result.error || 'HTTP ' + response.status);
        }
        dirty = false;
        showToast('Spieler gespeichert ✓');
      } catch (error) {
        showToast('Spieler nicht gespeichert: ' + error.message);
      } finally {
        btn.disabled = !dirty;
        btn.textContent = '💾 Speichern';
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2600);
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function escAttr(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── Profile ──
    function renderProfiles() {
      const list = document.getElementById('profileList');
      if (!profiles.length) {
        list.innerHTML = '<span style="color:#444;font-size:.82rem">Noch keine Profile. Lege Stammspieler an, die du den Slots zuweisen kannst.</span>';
        return;
      }
      list.innerHTML = profiles.map((pr, i) =>
        '<div class="profile-chip">' +
          '<span class="p-dot" style="background:' + escAttr(pr.gradient || pr.color || '#555') + '"></span>' +
          '<span class="p-name">' + escHtml(pr.name) + '</span>' +
          '<div class="profile-color-options" aria-label="Farbe für ' + escAttr(pr.name) + '">' +
            COLORS.map((color, colorIdx) => '<span class="profile-color-dot' + (color === pr.color ? ' selected' : '') + '" style="background:' + color + '" title="' + color + '" onclick="pickProfileColor(' + i + ',' + colorIdx + ',event)"></span>').join('') +
            '<input class="profile-custom-color" type="color" value="' + escAttr(normalizeColor(pr.color, '#e63946')) + '" aria-label="Eigene Farbe für ' + escAttr(pr.name) + '" title="Eigene Farbe" onchange="pickCustomProfileColor(' + i + ',this.value,event)" />' +
          '</div>' +
          '<div class="profile-gradient" title="Mehrfarbiger Verlauf für das Profil">' +
            '<input type="color" value="' + escAttr(getGradientColor(pr, 0)) + '" aria-label="Verlaufsfarbe 1" onchange="pickProfileGradient(' + i + ',0,this.value,event)" />' +
            '<input type="color" value="' + escAttr(getGradientColor(pr, 1)) + '" aria-label="Verlaufsfarbe 2" onchange="pickProfileGradient(' + i + ',1,this.value,event)" />' +
          '</div>' +
          '<span class="p-del" onclick="removeProfile(' + i + ')">✕</span>' +
        '</div>'
      ).join('');
    }

    function pickProfileColor(profileIdx, colorIdx, event) {
      const profile = profiles[profileIdx];
      const color = COLORS[colorIdx];
      if (!profile || !color) return;
      profile.color = color;
      players.forEach(player => {
        if (Number(player.profileId) === Number(profile.id)) player.color = color;
      });
      profilesDirty = true;
      dirty = true;
      document.getElementById('saveBtn').disabled = false;
      renderProfiles();
      renderSlots();
      renderSummary();
      event.stopPropagation();
    }

    function pickCustomProfileColor(profileIdx, color, event) {
      const profile = profiles[profileIdx];
      const normalized = normalizeColor(color, '#e63946');
      if (!profile) return;
      profile.color = normalized;
      players.forEach(player => {
        if (Number(player.profileId) === Number(profile.id)) player.color = normalized;
      });
      profilesDirty = true;
      dirty = true;
      document.getElementById('saveBtn').disabled = false;
      renderProfiles();
      renderSlots();
      renderSummary();
      event.stopPropagation();
    }

    function pickProfileGradient(profileIdx, colorIdx, color, event) {
      const profile = profiles[profileIdx];
      if (!profile) return;
      const normalized = normalizeColor(color, colorIdx === 0 ? (profile.color || '#e63946') : '#2ec4b6');
      profile.gradientStart = colorIdx === 0 ? normalized : normalizeColor(profile.gradientStart, profile.color || '#e63946');
      profile.gradientEnd = colorIdx === 1 ? normalized : normalizeColor(profile.gradientEnd, '#2ec4b6');
      profile.gradient = 'linear-gradient(135deg,' + profile.gradientStart + ',' + profile.gradientEnd + ')';
      profilesDirty = true;
      renderProfiles();
      event.stopPropagation();
    }

    function normalizeColor(value, fallback) {
      const color = String(value || '').trim();
      return /^#[0-9a-f]{6}$/i.test(color) ? color.toLowerCase() : fallback;
    }

    function getGradientColor(profile, index) {
      const fallback = index === 0 ? (profile.color || '#e63946') : '#2ec4b6';
      const matches = String(profile.gradient || '').match(/#[0-9a-f]{6}/gi);
      return normalizeColor(matches && matches[index], fallback);
    }

    function addProfile() {
      const input = document.getElementById('profileNameInput');
      const name = input.value.trim();
      if (!name) return;
      profiles.push({ name, color: COLORS[profiles.length % COLORS.length] });
      input.value = '';
      profilesDirty = true;
      renderProfiles();
      renderSlots();
      showToast('Profil "' + name + '" hinzugefügt (noch nicht gespeichert)');
    }

    function removeProfile(idx) {
      const removed = profiles.splice(idx, 1)[0];
      profilesDirty = true;
      if (removed) {
        const removedName = String(removed.name || '').trim().toLowerCase();
        players.forEach(player => {
          if (String(player.name || '').trim().toLowerCase() === removedName) {
            player.name = '';
            player.active = false;
          }
        });
        dirty = true;
        document.getElementById('saveBtn').disabled = false;
      }
      renderProfiles();
      renderSlots();
      if (removed) showToast('Profil "' + removed.name + '" entfernt');
    }

    async function saveProfiles() {
      const btn = document.getElementById('saveProfilesBtn');
      btn.disabled = true;
      btn.textContent = '…';
      try {
        const response = await fetch('/api/profiles', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(profiles)
        });
        if (!response.ok) {
          const result = await response.json().catch(() => ({}));
          throw new Error(result.error || 'HTTP ' + response.status);
        }
        profilesDirty = false;
        if (dirty) await saveAll();
        showToast('Profile gespeichert ✓');
      } catch (error) {
        showToast('Profile nicht gespeichert: ' + error.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Profile speichern';
      }
    }

    function applyProfile(idx, sel) {
      const profile = profiles.find(pr => Number(pr.id) === Number(sel.value));
      players[idx].profileId = profile ? Number(profile.id) : null;
      players[idx].name = profile ? profile.name : '';
      if (profile) {
        if (profile && profile.color) {
          players[idx].color = profile.color;
        }
      }
      renderSlots();
      renderSummary();
      markDirty();
    }

    load();
  </script>
</body>
</html>
