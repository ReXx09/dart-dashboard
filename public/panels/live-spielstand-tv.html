<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Live-Spielstand TV</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a;
      color: #f1f1f1;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      overflow: hidden;
    }
    .topbar {
      background: #111;
      border-bottom: 3px solid #e63946;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .topbar h2 { font-size: 1rem; font-weight: 700; flex: 1; }
    .live-badge { background: #e63946; color: #fff; font-size: .58rem; padding: 3px 8px; border-radius: 20px; font-weight: 700; letter-spacing: .5px; }
    main {
      padding: 6px;
      max-width: none;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      height: calc(100vh - 44px);
    }
    .focus-player {
      flex: 1;
      display: grid;
      grid-template-columns: 1.35fr .65fr;
      gap: 4px;
      align-items: stretch;
      min-height: 0;
    }
    .focus-player.single { grid-template-columns: 1fr; }
    .focus-player.has-others { flex: 1; max-height: 70%; min-height: 0; }
    .compact-players {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
      max-height: 28%;
      min-height: 0;
    }
    .compact-players:empty { display: none; }
    .compact-players .score-card {
      flex: 1;
      min-width: 0;
    }
    .focus-card {
      background: linear-gradient(135deg, #191111, #141414);
      border-radius: 14px;
      padding: 10px;
      border: 2px solid var(--pc, #e63946);
      box-shadow: 0 0 30px rgba(230,57,70,.16);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .focus-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 20% 10%, var(--pc-glow, rgba(230,57,70,.18)), transparent 35%);
      pointer-events: none;
    }
    .focus-card > * { position: relative; }
    .focus-name { font-size: 1.1rem; font-weight: 800; margin-bottom: 2px; }
    .focus-meta { color: #777; font-size: .68rem; margin-bottom: 4px; }
    .focus-kacheln {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
      flex: 1;
    }
    .focus-kachel {
      background: #0f0f0f;
      border: 1px solid #262626;
      border-radius: 11px;
      padding: 8px;
      min-height: 135px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .focus-kachel h4 { color: #777; font-size: .6rem; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 4px; }
    .focus-kachel .subline { color: #555; font-size: .62rem; margin-top: 2px; }
    .throw-segments { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; width: 100%; }
    .throw-seg {
      background: #1b1b1b;
      border: 1px solid #2b2b2b;
      border-radius: 10px;
      min-height: 58px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-weight: 800;
    }
    .throw-seg .seg { font-size: 1.15rem; color: var(--pc, #e63946); }
    .throw-seg .pts { font-size: .66rem; color: #555; margin-top: 2px; }
    .focus-big-score { font-size: 3.5rem; font-weight: 900; line-height: 1; color: var(--pc, #f4a261); font-variant-numeric: tabular-nums; }
    .focus-summary { margin-top: 4px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
    .focus-summary div { background: #141414; border-radius: 10px; padding: 4px; text-align: center; }
    .focus-summary span { display: block; color: #666; font-size: .5rem; text-transform: uppercase; letter-spacing: 1px; }
    .focus-summary strong { display: block; color: #f1f1f1; font-size: .78rem; margin-top: 1px; }
    .focus-leg-card {
      background: #141414;
      border-radius: 14px;
      padding: 5px;
      border: 2px solid #1e1e1e;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .focus-leg-card h4 { color: #777; font-size: .56rem; letter-spacing: 1.5px; text-transform: uppercase; text-align: center; }
    .leg-list { width: 100%; display: grid; gap: 3px; max-height: 380px; overflow: auto; }
    .leg-item { display: flex; justify-content: space-between; align-items: center; background: #1b1b1b; border: 1px solid #2b2b2b; border-radius: 8px; padding: 4px 6px; font-size: .65rem; }
    .leg-item .idx { color: #777; }
    .leg-item .score { color: #f4a261; font-weight: 700; font-variant-numeric: tabular-nums; }

    .score-card {
      background: #141414;
      border-radius: 12px;
      padding: 12px;
      border: 2px solid #1e1e1e;
      position: relative;
      overflow: hidden;
      display: flex;
      flex: 1;
      min-width: 0;
      flex-direction: column;
      gap: 6px;
    }
    .score-card .sc-color-bar { width: 100%; height: 3px; background: var(--pc, #e63946); border-radius: 3px; }
    .score-card .sc-name { font-size: .86rem; font-weight: 700; }
    .score-card .sc-score { font-size: 2.2rem; font-weight: 800; line-height: 1; color: var(--pc, #f4a261); font-variant-numeric: tabular-nums; }

    /* Winner Overlay */
    .winner-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .winner-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .winner-card {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border: 3px solid #f4a261;
      border-radius: 24px;
      padding: 40px 60px;
      text-align: center;
      box-shadow: 0 0 60px rgba(244, 162, 97, 0.4), 0 20px 40px rgba(0,0,0,0.5);
      transform: scale(0.9);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .winner-overlay.show .winner-card {
      transform: scale(1);
    }
    .winner-icon {
      font-size: 4rem;
      margin-bottom: 16px;
      animation: bounce 1s ease infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .winner-title {
      font-size: 2.5rem;
      font-weight: 800;
      color: #f4a261;
      margin-bottom: 8px;
      text-shadow: 0 0 20px rgba(244, 162, 97, 0.5);
    }
    .winner-name {
      font-size: 3rem;
      font-weight: 900;
      color: #f4a261;
      margin-bottom: 16px;
      text-shadow: 0 0 30px rgba(244, 162, 97, 0.6);
    }
    .winner-stats {
      display: flex;
      gap: 32px;
      justify-content: center;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid rgba(244, 162, 97, 0.3);
    }
    .winner-stat {
      text-align: center;
    }
    .winner-stat-label {
      font-size: 0.8rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .winner-stat-value {
      font-size: 1.8rem;
      font-weight: 800;
      color: #f4a261;
    }
    .winner-btn {
      background: linear-gradient(135deg, #f4a261, #e63946);
      border: none;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 16px 48px;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .winner-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 30px rgba(244, 162, 97, 0.5);
    }
    .confetti-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 10001;
    }
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      top: -10px;
      animation: confetti-fall 3s linear forwards;
    }
    @keyframes confetti-fall {
      to {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
      }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .score-card .sc-stats { font-size: .68rem; color: #666; line-height: 1.5; }
    .score-card .sc-stats span { color: #aaa; font-weight: 600; }
    .score-card .sc-last-throws { display: flex; gap: 3px; }
    .score-card .sc-throw-chip { background: #1e1e1e; border-radius: 5px; padding: 2px 6px; font-size: .72rem; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 24px; text-align: center; }
    .score-card .sc-throw-chip.empty { color: #333; }

    @media (width: 1024px) and (height: 860px) {
      .focus-kacheln { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .focus-kachel { min-height: 175px; padding: 6px; }
      .focus-kachel h4 { font-size: .55rem; }
      .throw-seg { min-height: 48px; }
      .throw-seg .seg { font-size: 1rem; }
      .focus-big-score { font-size: 4.2rem; }
      .focus-summary { margin-top: 2px; }
      .focus-summary div { padding: 3px; }
      .focus-summary span { font-size: .45rem; }
      .focus-summary strong { font-size: .7rem; }
      .focus-player.has-others { flex: 1; }
      .focus-leg-card { display: none; } /* Leg-Historie ausblenden auf TV */
      .compact-players { gap: 3px; max-height: 20%; }
      .compact-players .score-card { padding: 4px 8px; gap: 3px; flex-direction: row; align-items: center; border-radius: 6px; }
      .compact-players .score-card .sc-color-bar { width: 3px; height: 28px; align-self: center; flex-shrink: 0; border-radius: 2px; }
      .compact-players .score-card .sc-name { font-size: .65rem; white-space: nowrap; flex-shrink: 0; }
      .compact-players .score-card .sc-score { font-size: 1.1rem; white-space: nowrap; flex-shrink: 0; }
      .compact-players .score-card .sc-stats { font-size: .5rem; white-space: nowrap; flex-shrink: 0; }
      .compact-players .score-card .sc-last-throws { flex-shrink: 0; }
      .compact-players .score-card .sc-throw-chip { font-size: .55rem; padding: 1px 3px; min-width: 16px; border-radius: 4px; }
    }

<body>
  <!-- Winner Overlay -->
  <div class="winner-overlay" id="winnerOverlay"></div>
  
  <!-- Toast -->
  <div class="toast" id="toast"></div>
  
  <div class="topbar">
    <h2>🎯 Live-Spielstand</h2>
    <span class="live-badge">LIVE</span>
  </div>
  <main>
    <section class="focus-player" id="focusPlayer"><div style="text-align:center;padding:40px;color:#555">Lade Spieler...</div></section>
    <section class="compact-players" id="compactPlayers"></section>
    <div id="countdownDisplay" style="display:none;text-align:center;padding:6px;background:#1a1a1a;border:1px solid #e63946;border-radius:10px;color:#f4a261;font-weight:700;font-size:.9rem"></div>
  </main>
  <script>
    let liveState = null;
    let countdownTimer = null;

    function startCountdown(state) {
      if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
      const action = state && state.lastAction;
      if (!action || !action.autoAdvancePending || !action.autoAdvanceDelayMs) {
        const el = document.getElementById('countdownDisplay');
        if (el) el.style.display = 'none';
        return;
      }
      const startedAt = action.autoAdvanceStartedAt || Date.now();
      const delayMs = action.autoAdvanceDelayMs;
      countdownTimer = setInterval(() => {
        const elapsed = Date.now() - startedAt;
        const remaining = Math.max(0, delayMs - elapsed);
        const el = document.getElementById('countdownDisplay');
        if (remaining <= 0) {
          if (el) el.style.display = 'none';
          if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
          return;
        }
        if (el) {
          el.style.display = '';
          el.textContent = 'Nächster Spieler in ' + Math.ceil(remaining / 1000) + 's';
        }
      }, 200);
    }

    function escapeHtml(str) { if (!str) return ''; return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function escapeAttr(str) { if (!str) return ''; return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function getPointsPerAufnahme(player) {
      const currentRound = Array.isArray(player && player.currentRoundPoints) ? player.currentRoundPoints : [];
      // Wenn currentRoundPoints existiert (auch wenn leer), ist das die aktuelle Aufnahme
      // Leeres Array = neue Aufnahme begonnen, noch keine Würfe -> 0 Punkte
      if (currentRound.length >= 0) {
        return currentRound.reduce((sum, pt) => sum + (Number(pt) || 0), 0);
      }
      const throws = Array.isArray(player && player.throws) ? player.throws : [];
      if (throws.length === 0) return '-';
      const remainder = throws.length % 3;
      const chunkSize = remainder === 0 ? 3 : remainder;
      const lastChunk = throws.slice(-chunkSize);
      return lastChunk.reduce((sum, t) => sum + (Number(t && t.points) || 0), 0);
    }

    function renderFocusPlayer(p, idx, state) {
      if (!p) return '';
      const currentRound = Array.isArray(p.currentRoundPoints) ? p.currentRoundPoints : [];
      const throws = Array.isArray(p.throws) ? p.throws : [];
      const lastThrows = throws.slice(-3);
      // Wenn currentRoundPoints existiert (auch leer), das für Anzeige nutzen
      // Leeres Array = neue Aufnahme begonnen, noch keine Würfe -> leere Slots anzeigen
      const displayThrows = Array.isArray(p.currentRoundPoints) ? [...p.currentRoundPoints] : lastThrows.map(t => t.points);
      while (displayThrows.length < 3) displayThrows.push(null);
      const totalScored = p.totalScored || 0;
      const turns = p.turns || 0;
      const legAvg = turns > 0 ? (totalScored / turns * 3).toFixed(1) : '-';
      const currentRoundScore = displayThrows.reduce((sum, pt) => sum + (pt === null ? 0 : (Number(pt) || 0)), 0);
      const aufnahmeScore = getPointsPerAufnahme(p);
      const throwsHtml = displayThrows.map((pt, ti) => {
        const label = pt === null ? '-' : String(pt);
        const pointsLabel = pt === null ? 'offen' : (pt === 0 ? '0' : '+' + pt);
        return '<div class="throw-seg" style="--pc:' + escapeAttr(p.color || '#f4a261') + '">' +
          '<div class="seg">' + label + '</div>' +
          '<div class="pts">' + pointsLabel + '</div>' +
        '</div>';
      }).join('');

      return '<div class="focus-card" style="--pc:' + escapeAttr(p.color || '#f4a261') + ';--pc-glow:' + colorToRgba(p.color || '#e63946', .18) + '">' +
        '<div class="focus-name">🎯 ' + escapeHtml(p.name) + '</div>' +
        '<div class="focus-meta">Spieler ' + p.slot + ' wirft gerade &bull; Runde ' + (state.game.throwRound || 1) + ' &bull; Wurf ' + ((state.game.currentThrow || 0) + 1) + ' von 3</div>' +
        '<div class="focus-kacheln">' +
          '<div class="focus-kachel">' +
            '<h4>Aktuelle Würfe / Zahlen</h4>' +
            '<div class="throw-segments">' + throwsHtml + '</div>' +
            '<div class="subline">Runden-Punkte: <strong>' + currentRoundScore + '</strong></div>' +
          '</div>' +
          '<div class="focus-kachel">' +
            '<h4>Punkte pro Aufnahme</h4>' +
            '<div class="focus-big-score" style="font-size:4.2rem">' + aufnahmeScore + '</div>' +
            '<div style="color:#777;font-size:.82rem">Aktuelle Aufnahme</div>' +
          '</div>' +
          '<div class="focus-kachel">' +
            '<h4>Gesamt / Rest</h4>' +
            '<div class="focus-big-score">' + p.remaining + '</div>' +
            '<div style="color:#777;font-size:.82rem">Restpunkte</div>' +
          '</div>' +
        '</div>' +
        '<div class="focus-summary">' +
          '<div><span>Turns</span><strong>' + turns + '</strong></div>' +
          '<div><span>Gesamt Punkte</span><strong>' + totalScored + '</strong></div>' +
          '<div><span>Leg Average</span><strong>' + legAvg + '</strong></div>' +
        '</div>' +
      '</div>';
    }

    function renderFocusLegCard(p) {
      if (!p) return '';
      const throws = Array.isArray(p.throws) ? p.throws : [];
      const turnScores = [];
      for (let i = 0; i < throws.length; i += 3) {
        const chunk = throws.slice(i, i + 3);
        const score = chunk.reduce((sum, t) => sum + (Number(t.points) || 0), 0);
        turnScores.push(score);
      }
      const legListHtml = turnScores.length
        ? turnScores.slice(-20).reverse().map((score, orderIdx) => {
            const turnIdx = turnScores.length - orderIdx;
            return '<div class="leg-item"><span class="idx">Aufnahme ' + turnIdx + '</span><span class="score">' + score + '</span></div>';
          }).join('')
        : '<div class="subline">Noch keine Aufnahmen erfasst</div>';
      return '<aside class="focus-leg-card" style="--pc:' + escapeAttr(p.color || '#f4a261') + '">' +
        '<h4>Aufnahmen im Leg</h4>' +
        '<div class="leg-list">' + legListHtml + '</div>' +
      '</aside>';
    }

    function renderCricketView(p, state) {
      if (!p) return '';
      const throws = Array.isArray(p.throws) ? p.throws : [];
      const lastThrows = throws.slice(-3);
      const cricketHits = p.cricketHits || {};
      const cricketClosed = p.cricketClosed || {};
      const nums = [15,16,17,18,19,20,25];
      const gridHtml = nums.map(n => {
        const hits = cricketHits[n] || 0;
        const closed = !!cricketClosed[n];
        return '<div class="c-num' + (closed ? ' closed' : '') + '"><div class="num">' + n + '</div><div class="hits">' + (closed ? '✔' : hits + '/3') + '</div></div>';
      }).join('');
      const totalScored = p.totalScored || 0;
      const turns = p.turns || 0;
      const legAvg = turns > 0 ? (totalScored / turns * 3).toFixed(1) : '-';
      return '<div class="focus-card" style="--pc:' + escapeAttr(p.color || '#e63946') + ';--pc-glow:' + colorToRgba(p.color || '#e63946', .18) + '">' +
        '<div class="focus-name">🎯 ' + escapeHtml(p.name) + ' · Cricket</div>' +
        '<div class="focus-meta">Spieler ' + p.slot + ' wirft gerade &bull; Runde ' + (state.game.throwRound || 1) + ' &bull; Wurf ' + ((state.game.currentThrow || 0) + 1) + ' von 3</div>' +
        '<div class="focus-kacheln" style="grid-template-columns:1fr 1fr">' +
          '<div class="focus-kachel"><h4>Zahlen</h4><div class="cricket-grid horizontal">' + gridHtml + '</div></div>' +
          '<div class="focus-kachel"><h4>Letzte Würfe</h4><div class="throw-segments">' + lastThrows.map(t => '<div class="throw-seg" style="--pc:' + escapeAttr(p.color || '#e63946') + '"><div class="seg">' + (t.points || 0) + '</div></div>').join('') + '</div></div>' +
        '</div>' +
        '<div class="focus-summary"><div><span>Turns</span><strong>' + turns + '</strong></div><div><span>Punkte</span><strong>' + totalScored + '</strong></div><div><span>Leg Average</span><strong>' + legAvg + '</strong></div></div>' +
      '</div>';
    }

    function colorToRgba(hex, alpha) {
      const clean = String(hex || '#e63946').replace('#', '');
      if (clean.length !== 6) return 'rgba(230,57,70,' + alpha + ')';
      const r = parseInt(clean.slice(0, 2), 16);
      const g = parseInt(clean.slice(2, 4), 16);
      const b = parseInt(clean.slice(4, 6), 16);
      return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
    }

    function renderCompactPlayer(p, mode) {
      const currentRound = Array.isArray(p.currentRoundPoints) ? p.currentRoundPoints : [];
      const lastThrows = Array.isArray(p.throws) ? p.throws.slice(-3).map(t => t.points) : [];
      // Wenn currentRoundPoints existiert UND Inhalt hat, das für Anzeige nutzen
      const displayThrows = (Array.isArray(p.currentRoundPoints) && p.currentRoundPoints.length > 0) ? [...p.currentRoundPoints] : lastThrows;
      while (displayThrows.length < 3) displayThrows.push('-');
      const totalScored = p.totalScored || 0;
      const turns = p.turns || 0;
      const legAvg = turns > 0 ? (totalScored / turns * 3).toFixed(1) : '-';
      const isCricket = mode === 'cricket';
      const displayScore = isCricket ? (p.totalScored || 0) : p.remaining;
      const shortName = (p.name || '').length > 8 ? (p.name || '').substring(0, 8) + '...' : (p.name || '');

      return '<div class="score-card" data-tv style="--pc:' + escapeAttr(p.color || '#f4a261') + '">' +
        '<div class="sc-color-bar"></div>' +
        '<div class="sc-name">P' + p.slot + '.' + escapeHtml(shortName) + '</div>' +
        '<div class="sc-score">' + displayScore + '</div>' +
        '<div class="sc-stats">LG-AVG <span>' + legAvg + '</span> Legs <span>' + (p.legs || 0) + '</span></div>' +
        '<div class="sc-last-throws">' + displayThrows.map((pt) => '<span class="sc-throw-chip' + (pt === '-' ? ' empty' : '') + '">' + pt + '</span>').join('') + '</div>' +
      '</div>';
    }

    function renderState(state) {
      if (!state || !Array.isArray(state.players) || state.players.length === 0) return;
      const activePlayer = state.game.activePlayer || 0;
      const mode = state.game.mode || '501';
      const active = state.players[activePlayer];
      const focusPlayer = document.getElementById('focusPlayer');
      const compactPlayers = document.getElementById('compactPlayers');

      const isCricket = mode === 'cricket';
      const hasOthers = state.players.length > 1;
      focusPlayer.classList.toggle('has-others', hasOthers);

      // Check for leg finished (winner)
      const isLegFinished = state.game.status === 'leg-finished';
      const winner = isLegFinished ? state.players.find(p => p.remaining === 0) : null;

      if (isCricket) {
        focusPlayer.classList.add('single');
        focusPlayer.innerHTML = renderCricketView(active, state);
      } else {
        focusPlayer.classList.remove('single');
        focusPlayer.innerHTML = renderFocusPlayer(active, activePlayer, state) + renderFocusLegCard(active);
      }

      if (hasOthers) {
        const compactOrder = [...state.players]
          .filter((_p, idx) => idx !== activePlayer)
          .sort((a, b) => (Number(a.legs || 0) - Number(b.legs || 0)) || (Number(a.remaining || 0) - Number(b.remaining || 0)) || (Number(a.slot || 0) - Number(b.slot || 0)));
        compactPlayers.innerHTML = compactOrder
          .map((p) => renderCompactPlayer(p, mode)).join('');
      } else {
        compactPlayers.innerHTML = '';
      }

      // Winner overlay
      if (isLegFinished && winner) {
        showWinnerOverlay(winner, state);
      } else {
        hideWinnerOverlay();
      }

      startCountdown(state);
    }

    // ── Winner Overlay ──
    function showWinnerOverlay(winner, state) {
      const overlay = document.getElementById('winnerOverlay');
      if (!overlay) return;
      
      const checkout = state.lastAction?.points || 0;
      const dartsThrown = winner.turns * 3 - (3 - (state.game.currentThrow || 0));
      const avg = winner.turns > 0 ? (winner.totalScored / winner.turns * 3).toFixed(1) : '-';
      
      overlay.innerHTML = `
        <div class="confetti-container" id="confettiContainer"></div>
        <div class="winner-card">
          <div class="winner-icon">🏆</div>
          <div class="winner-subtitle">LEG GEWONNEN</div>
          <div class="winner-name">${escapeHtml(winner.name)}</div>
          <div class="winner-subtitle">Checkout: ${checkout} Punkte</div>
          <div class="winner-stats">
            <div class="winner-stat">
              <div class="winner-stat-label">Darts</div>
              <div class="winner-stat-value">${dartsThrown}</div>
            </div>
            <div class="winner-stat">
              <div class="winner-stat-label">Leg Average</div>
              <div class="winner-stat-value">${avg}</div>
            </div>
            <div class="winner-stat">
              <div class="winner-stat-label">Legs</div>
              <div class="winner-stat-value">${winner.legs || 0}</div>
            </div>
          </div>
          <button class="winner-btn" onclick="hideWinnerOverlay(); nextLeg()">Nächstes Leg starten</button>
        </div>
      `;
      
      overlay.classList.add('show');
      overlay.style.display = 'flex';
      createConfetti();
    }

    function hideWinnerOverlay() {
      const overlay = document.getElementById('winnerOverlay');
      if (overlay) {
        overlay.classList.remove('show');
        overlay.style.display = 'none';
      }
    }

    function createConfetti() {
      const container = document.getElementById('confettiContainer');
      if (!container) return;
      container.innerHTML = '';
      const colors = ['#f4a261', '#e63946', '#2a9d8f', '#457b9d', '#9b5de5', '#f77f00'];
      for (let i = 0; i < 80; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * 100 + '%';
        confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.animationDelay = (Math.random() * 2) + 's';
        confetti.style.animationDuration = (2 + Math.random() * 2) + 's';
        container.appendChild(confetti);
      }
    }

    // ── Next Leg ──
    async function nextLeg() {
      try {
        var r = await fetch('/api/live/reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ carryLegs: true })
        });
        if (!r.ok) { showToast('Fehler', true); return; }
        liveState = await r.json();
        renderState(liveState);
        hideWinnerOverlay();
        showToast('Nächstes Leg gestartet');
      } catch(e) { showToast('Netzwerkfehler', true); }
    }

    // ── Toast ──
    function showToast(msg, isError) {
      const t = document.getElementById('toast');
      if (!t) return;
      t.textContent = msg;
      t.className = 'toast show' + (isError ? ' err' : '');
      setTimeout(() => t.className = 'toast', 2500);
    }

    async function loadAll() {
      try {
        const stateRes = await fetch('/api/live/state');
        if (!stateRes.ok) throw new Error('HTTP ' + stateRes.status);
        const state = await stateRes.json();
        liveState = state;
        renderState(state);
      } catch(e) {
        document.getElementById('focusPlayer').innerHTML = '<div style="text-align:center;padding:40px;color:#e63946">⚠️ Live-State API nicht erreichbar</div>';
      }
    }

    (function() {
      const sse = new EventSource('/api/events');
      let reloadQueued = false;
      sse.addEventListener('reload', () => {
        if (reloadQueued) return;
        reloadQueued = true;
        setTimeout(() => {
          reloadQueued = false;
          loadAll().catch(() => {});
        }, 120);
      });
    })();

    loadAll();
  </script>
</body>
</html>
